        const spritesObj = (ctx === this) ? this.sprites : ctx.sprites;

        let el   = spritesObj[cmd.id];
        const isNew = !el;

        if (isNew) {
            el = document.createElement('div');
            el.className  = 'sprite';
            el.dataset.id = cmd.id;
            el.appendChild(Object.assign(document.createElement('div'), { className: 'sprite-inner' }));
            this.dom.spritesLayer.appendChild(el);
            spritesObj[cmd.id] = el;
        }

        if (cmd.pos != null) el.style.left = `${this.parsePosition(cmd.pos)}%`;
        const inner = el.querySelector('.sprite-inner');
        const zoom  = cmd.zoom || 1.0;
        inner.style.setProperty('--sprite-scale', zoom);
        inner.style.transform = `scale(${zoom})`;
        el.style.transform = `translateX(-50%)${cmd.flip ? ' scaleX(-1)' : ''}`;

        this._setSpriteImage(el, cmd.file, cmd.transition || 0, () => {
            if (isNew) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
        });

        this._executeNext();
    },

    cmdShow(cmd) {
        if (!cmd.sprite) { this._executeNext(); return; }
        const ctx = this.getContext();
        const sbf = (ctx === this) ? this.spritesByFile : ctx.spritesByFile;

        let el   = sbf[cmd.sprite];
        const isNew = !el;

        if (isNew) {
            el = document.createElement('div');
            el.className = 'sprite';
            el.appendChild(Object.assign(document.createElement('div'), { className: 'sprite-inner' }));
            this.dom.spritesLayer.appendChild(el);
            sbf[cmd.sprite] = el;
        }

        el.style.left = `${this.parsePosition(cmd.pos)}%`;
        const inner = el.querySelector('.sprite-inner');
        const zoom  = cmd.zoom || 1.0;
        inner.style.setProperty('--sprite-scale', zoom);
        inner.style.transform = `scale(${zoom})`;
        el.style.transform = `translateX(-50%)${cmd.flip ? ' scaleX(-1)' : ''}`;

        this._setSpriteImage(el, cmd.sprite, cmd.transition || 0, () => {
            if (isNew) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
        });

        this._executeNext();
    },

    cmdHide(cmd) {
        const fade = (cmd.fade || 0.3) * 1000;
        const ctx  = this.getContext();
        const spritesObj = (ctx === this) ? this.sprites      : ctx.sprites;
        const sbfObj     = (ctx === this) ? this.spritesByFile : ctx.spritesByFile;

        const hideEl = el => { el.classList.add('hiding'); el.classList.remove('visible'); };

        if (cmd.target === '__all__' || cmd.target === 'all') {
            [...Object.values(spritesObj), ...Object.values(sbfObj)].forEach(hideEl);
            setTimeout(() => {
                this.dom.spritesLayer.innerHTML = '';
                if (ctx === this) { this.sprites = {}; this.spritesByFile = {}; }
                else              { ctx.sprites  = {}; ctx.spritesByFile  = {}; }
            }, fade);
        } else {
            const el = spritesObj[cmd.target] || sbfObj[cmd.target];
            if (el) {
                hideEl(el);
                setTimeout(() => {
                    el.remove();
                    delete spritesObj[cmd.target];
                    delete sbfObj[cmd.target];
                }, fade);
            }
        }
        this._executeNext();
    },

    cmdClear(cmd) {
        const fade = cmd.fade || 0.3;
        this._clearSprites(fade, () => this._executeNext());
    },

    cmdMove(cmd) {
        const ctx = this.getContext();
        const spritesObj = (ctx === this) ? this.sprites      : ctx.sprites;
        const sbfObj     = (ctx === this) ? this.spritesByFile : ctx.spritesByFile;
        const el = spritesObj[cmd.target] || sbfObj[cmd.target];
        if (!el) { this._executeNext(); return; }

        const dur = cmd.dur || 0.5;
        el.style.transition = `left ${dur}s cubic-bezier(0.4, 0, 0.2, 1)`;
        requestAnimationFrame(() => { el.style.left = `${this.parsePosition(cmd.pos)}%`; });
        setTimeout(() => this._executeNext(), dur * 1000);
    },

    // ============================================================
    // КОМАНДЫ — ЭФФЕКТЫ
    // ============================================================

    cmdFx(cmd) {
        const ctx = this.getContext();
        const spritesObj = (ctx === this) ? this.sprites      : ctx.sprites;
        const sbfObj     = (ctx === this) ? this.spritesByFile : ctx.spritesByFile;
        const el    = spritesObj[cmd.target] || sbfObj[cmd.target];
        const inner = el?.querySelector('.sprite-inner');
        if (!inner) { this._executeNext(); return; }

        const fx  = cmd.effect;
        const dur = cmd.param1 || 0.5;
        inner.style.animation = 'none';
        void inner.offsetHeight;

        const clear = () => { inner.style.animation = ''; };
        const eff = {
            shake:   () => { inner.style.animation = `sprite-shake ${dur}s ease`; setTimeout(clear, dur*1000); },
            pulse:   () => { inner.style.animation = `sprite-pulse ${dur}s ease infinite`; setTimeout(clear, dur*1000); },
            bounce:  () => { inner.style.animation = `sprite-bounce ${dur}s cubic-bezier(0.34,1.56,0.64,1)`; setTimeout(clear, dur*1000); },
            glow:    () => { inner.style.animation = `sprite-glow ${dur}s ease infinite`; setTimeout(clear, dur*1000); },
            tremble: () => { inner.style.animation = `sprite-tremble 0.06s linear infinite`; setTimeout(clear, dur*1000); },
            float:   () => { inner.style.animation = `sprite-float ${dur}s ease-in-out infinite`; },
            sway:    () => { inner.style.animation = `sprite-sway ${dur}s ease-in-out infinite`; setTimeout(clear, dur*1000); },
            hop:     () => { inner.style.animation = `sprite-hop 0.3s ease`; setTimeout(clear, 350); },
            nod:     () => { inner.style.animation = `sprite-nod 0.4s ease`; setTimeout(clear, 450); },
            zoom:    () => {
                const scale = dur, time = cmd.param2 || 0.3;
                inner.style.setProperty('--sprite-scale', scale);
                inner.style.transition = `transform ${time}s cubic-bezier(0.4,0,0.2,1)`;
                requestAnimationFrame(() => { inner.style.transform = `scale(${scale})`; });
            },
            blur:    () => { inner.style.filter = `blur(${dur}px)`; inner.style.transition = 'filter 0.3s ease'; if (cmd.param2) setTimeout(() => { inner.style.filter = ''; }, cmd.param2*1000); },
            gray:    () => { inner.style.filter = 'grayscale(100%)'; inner.style.transition = 'filter 0.3s ease'; setTimeout(() => { inner.style.filter = ''; }, dur*1000); },
            bright:  () => { inner.style.filter = `brightness(${dur})`; inner.style.transition = 'filter 0.3s ease'; if (cmd.param2) setTimeout(() => { inner.style.filter = ''; }, cmd.param2*1000); },
            dim:     () => { inner.style.filter = 'brightness(0.6)'; inner.style.transition = 'filter 0.3s ease'; setTimeout(() => { inner.style.filter = ''; }, dur*1000); },
            reset:   () => { inner.style.animation = ''; inner.style.filter = ''; inner.style.transform = `scale(${inner.style.getPropertyValue('--sprite-scale') || 1})`; }
        };
        (eff[fx] || (() => {}))();
        this._executeNext();
    },

    cmdCustomFx(cmd) {
        const ctx = this.getContext();
        const spritesObj = (ctx === this) ? this.sprites      : ctx.sprites;
        const sbfObj     = (ctx === this) ? this.spritesByFile : ctx.spritesByFile;
        const el    = spritesObj[cmd.target] || sbfObj[cmd.target];
        const inner = el?.querySelector('.sprite-inner');
        if (!inner) { this._executeNext(); return; }

        inner.style.animation = 'none';
        void inner.offsetHeight;
        const iterStr = cmd.iterations === 'infinite' ? 'infinite' : cmd.iterations;
        inner.style.animation = `${cmd.animation} ${cmd.duration}s ${cmd.timing} ${iterStr}`;
        if (!cmd.keep && cmd.iterations !== 'infinite')
            setTimeout(() => { inner.style.animation = ''; }, cmd.duration * cmd.iterations * 1000 + 50);

        this._executeNext();
    },

    cmdDaytime(cmd) {
        const colors = {
            day:     'transparent',
            sunset:  'rgba(255,90,30,0.22)',
            night:   'rgba(15,15,50,0.45)',
            dawn:    'rgba(255,140,170,0.18)',
            evening: 'rgba(60,40,80,0.28)'
        };
        this.dom.daytimeOverlay.style.background = colors[cmd.time] || 'transparent';
        this._executeNext();
    },

    cmdScreen(cmd) {
        const dur = cmd.dur || 0.5;
        if (cmd.effect === 'shake') {
            this.dom.game.style.animation = 'none';
            void this.dom.game.offsetHeight;
            this.dom.game.style.animation = `screen-shake ${dur}s ease-out`;
            setTimeout(() => { this.dom.game.style.animation = ''; this._executeNext(); }, dur * 1000);
        } else if (cmd.effect === 'flash') {
            this.dom.flashOverlay.style.transition = 'none';
            this.dom.flashOverlay.style.opacity    = '1';
            void this.dom.flashOverlay.offsetHeight;
            this.dom.flashOverlay.style.transition = `opacity ${dur}s ease-out`;
            this.dom.flashOverlay.style.opacity    = '0';
            setTimeout(() => this._executeNext(), dur * 1000);
        } else {
            this._executeNext();
        }
    },

    // ============================================================
    // КОМАНДЫ — РАСШИРЕННЫЕ (v3)
    // ============================================================

    // ── chapter() — заставка новой главы ──
    cmdChapter(cmd) {
        const dur = cmd.duration || 2.8;

        // Применяем цвет/фон
        this.dom.chapterOverlay.style.background = cmd.bg || '#000000';
        this.dom.chapterSubtitle.textContent = cmd.subtitle || '';
        this.dom.chapterTitleText.textContent = cmd.title || '';

        // Показываем
        this.dom.chapterOverlay.classList.add('visible');

        setTimeout(() => {
            this.dom.chapterOverlay.classList.remove('visible');
            // Ждём конца transition (0.8s) и идём дальше
            setTimeout(() => this._executeNext(), 850);
        }, dur * 1000);
    },

    // ── scene() — составная команда ──
    cmdScene(cmd) {
        // Выполняем вложенные команды без прерывания конвейера
        const sub = [];
        if (cmd.bg)      sub.push({ cmd: 'bg',      file: Resources.resolve(cmd.bg,      'bg'),      fade: cmd.fade });
        if (cmd.music)   sub.push({ cmd: 'music',   file: Resources.resolve(cmd.music,   'music'),   fade_in: 2, fade_out: 1, volume: 1.0 });
        if (cmd.ambient) sub.push({ cmd: 'ambient', file: Resources.resolve(cmd.ambient, 'ambient'), volume: 0.5 });
        if (cmd.daytime) sub.push({ cmd: 'daytime', time: cmd.daytime });

        // Вставляем подкоманды прямо перед текущей позицией
        this.commands.splice(this.cmdIndex, 0, ...sub);
        this._executeNext();
    },

    // ── fullscreen_text() ──
    cmdFullscreenText(cmd) {
        const dur = cmd.duration || 3.0;

        this.dom.fsTextOverlay.style.background = cmd.bg || '#000000';
        this.dom.fsTextContent.style.color      = cmd.color    || '#ffffff';
        this.dom.fsTextContent.style.fontSize   = cmd.fontSize || '2em';
        this.dom.fsTextContent.textContent      = cmd.text || '';

        this.dom.fsTextOverlay.classList.add('visible');

        setTimeout(() => {
            this.dom.fsTextOverlay.classList.remove('visible');
            setTimeout(() => this._executeNext(), 650);
        }, dur * 1000);
    },

    // ── include() — вставка кода из другого файла ──
    async cmdInclude(cmd) {
        if (!this.currentModId) { this._executeNext(); return; }
        const mod  = this.currentMod;
        const url  = mod.basePath + cmd.file;

        try {
            const res = await fetchNoCache(url);
            if (!res.ok) throw new Error('Not found: ' + url);
            const code = await res.text();
            const parser = new ScenarioParser(this.currentModId);
            const data   = parser.parse(code);

            // Вставляем команды на текущую позицию
            this.commands.splice(this.cmdIndex, 0, ...data.commands);

            // Переиндексируем метки в новом общем массиве
            this._indexLabels(this.commands);

            this._executeNext();
        } catch(e) {
            LOG.error('include:', cmd.file, e);
            this._executeNext();
        }
    },

    // ── call() — прыжок с возвратом ──
    async cmdCall(cmd) {
        if (!this.currentModId) { this._executeNext(); return; }
        const mod = this.currentMod;
        const url = mod.basePath + cmd.file;

        try {
            const res = await fetchNoCache(url);
            if (!res.ok) throw new Error('Not found: ' + url);
            const code = await res.text();
            const parser = new ScenarioParser(this.currentModId);
            const data   = parser.parse(code);

            // Сохраняем текущий стек выполнения
            this.callStack.push({
                commands: this.commands,
                index:    this.cmdIndex,
                labels:   this._getLabels()
            });

            // Переключаемся на новый файл
            this.commands = data.commands;
            this.cmdIndex = 0;

            // Индексируем метки нового файла в контексте
            const ctx = this.getContext();
            const labels = {};
            data.commands.forEach((c, i) => { if (c.cmd === 'label') labels[c.name] = i; });
            if (ctx === this) this.labels = labels;
            else              ctx.labels  = labels;

            // Прыгаем на метку если указана
            if (cmd.label && labels[cmd.label] !== undefined) {
                this.cmdIndex = labels[cmd.label];
            }

            this._executeNext();
        } catch(e) {
            LOG.error('call:', cmd.file, e);
            this._executeNext();
        }
    },

    // ── return_from_call() ──
    cmdReturnFromCall() {
        if (!this.callStack.length) {
            LOG.warn('return_from_call без call');
            this._executeNext();
            return;
        }
        const state = this.callStack.pop();
        this.commands = state.commands;
        this.cmdIndex = state.index;

        // Восстанавливаем метки
        const ctx = this.getContext();
        if (ctx === this) this.labels = state.labels;
        else              ctx.labels  = state.labels;

        this._executeNext();
    },

    // ── custom_hook() — вызов JS-функции мода ──
    cmdCustomHook(cmd) {
        const modId = this.currentModId;
        if (!modId) { this._executeNext(); return; }

        if (cmd.type === 'js') {
            try {
                const fn = window.ModHooks?.[modId]?.[cmd.func];
                if (typeof fn === 'function') fn(...(cmd.args || []));
                else LOG.warn('custom_hook: функция не найдена:', cmd.func);
            } catch(e) { LOG.error('custom_hook:', e); }
        } else if (cmd.type === 'css') {
            this.addCustomCSS(cmd.args?.[0] || '');
        }

        this._executeNext();
    },

    // ============================================================
    // КОМАНДЫ — ДИАЛОГ
    // ============================================================

    cmdSay(cmd) {
        this.dom.speaker.textContent  = cmd.name  || '';
        this.dom.speaker.style.color  = cmd.color || '#fff';
        this.fullText        = cmd.text || '';
        this.currentTextIndex = 0;
        this.waitingForClick  = false;
        this.dom.dialogue.textContent = '';
        this.dom.continueIndicator.classList.remove('visible');

        if (this.settings.textSpeed >= 100) {
            this.dom.dialogue.textContent = this.fullText;
            this._finishText();
        } else {
            this.isTyping = true;
            this._typeText();
        }
    },

    _typeText() {
        if (!this.isTyping) return;
        if (this.currentTextIndex < this.fullText.length) {
            this.dom.dialogue.textContent += this.fullText[this.currentTextIndex++];
            const delay = Math.max(10, 60 - this.settings.textSpeed * 0.55);
            this.typeAnimationId = setTimeout(() => this._typeText(), delay);
        } else {
            this.isTyping = false;
            this._finishText();
        }
    },

    _finishTyping() {
        if (this.typeAnimationId) clearTimeout(this.typeAnimationId);
        this.isTyping = false;
        this.dom.dialogue.textContent = this.fullText;
        this._finishText();
    },

    _finishText() {
        this.waitingForClick = true;
        this.dom.continueIndicator.classList.add('visible');
    },

    // ============================================================
    // КОМАНДЫ — ВЫБОР
    // ============================================================

    cmdChoice(cmd) {
        const c = this.dom.choiceContainer;
        c.innerHTML = '';
        this.dom.continueIndicator.classList.remove('visible');
        this.dom.clickArea.classList.remove('active');

        const labels = this._getLabels();

        cmd.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className  = 'choice-btn';
            btn.textContent = opt.text;
            btn.style.opacity   = '0';
            btn.style.transform = 'translateY(10px)';
            btn.onclick = () => {
                c.classList.remove('visible');
                this.dom.clickArea.classList.add('active');
                if (labels[opt.target] !== undefined) this.cmdIndex = labels[opt.target];
                this._executeNext();
            };
            c.appendChild(btn);
            setTimeout(() => {
                btn.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
                btn.style.opacity    = '1';
                btn.style.transform  = 'translateY(0)';
            }, i * 80);
        });

        c.classList.add('visible');
    },

    // ============================================================
    // КОМАНДЫ — УСЛОВИЯ И ПЕРЕМЕННЫЕ
    // ============================================================

    cmdIf(cmd) {
        const ctx  = this.getContext();
        const vars = (ctx === this) ? (this.variables || {}) : ctx.variables;
        if (vars[cmd.var] && cmd.then?.length)
            cmd.then.forEach(c => this._executeCommand(c));
        this._executeNext();
    },

    cmdIfCmp(cmd) {
        const ctx  = this.getContext();
        const vars = (ctx === this) ? (this.variables || {}) : ctx.variables;
        const v = vars[cmd.var] || 0;
        const ops = {
            '>=': v >= cmd.val, '<=': v <= cmd.val,
            '>':  v >  cmd.val, '<':  v <  cmd.val,
            '==': v === cmd.val,'!=': v !== cmd.val
        };
        if (ops[cmd.op] && cmd.then?.length)
            cmd.then.forEach(c => this._executeCommand(c));
        this._executeNext();
    },

    // ============================================================
    // ЗАВЕРШЕНИЕ СЦЕНАРИЯ
    // ============================================================

    _endScenario() {
        const modId = this.currentModId;
        this.isRunning = false;
        this.isPaused  = false;

        this.dom.pauseMenu.classList.remove('visible');
        this.dom.pauseOptionsPanel.classList.remove('active');
        this.dom.chapterOverlay.classList.remove('visible');
        this.dom.fsTextOverlay.classList.remove('visible');

        this.dom.fadeOverlay.style.transition = 'opacity 0.8s ease';
        void this.dom.fadeOverlay.offsetHeight;
        this.dom.fadeOverlay.style.opacity    = '0';
        this.dom.flashOverlay.style.opacity   = '0';
        this.dom.daytimeOverlay.style.background = '';

        this._clearSprites(0.4, null);
        this._clearOverlays();

        this.dom.textbox.classList.remove('visible');
        this.dom.clickArea.classList.remove('active');
        this.dom.choiceContainer.classList.remove('visible');
        this.dom.continueIndicator.classList.remove('visible');

        this._stopAudio(1.0);

        if (modId) this._cleanupMod(modId);
        this.currentModId = null;
        this.currentMod   = null;
        this.callStack    = [];

        setTimeout(() => {
            this.dom.fadeOverlay.style.opacity = '0';
            this.dom.menu.classList.remove('hidden');
            this._initMenu();
        }, 600);
    }
};

// ============================================================
// СТАРТ
// ============================================================

document.addEventListener('DOMContentLoaded', () => VN.init());
</script>

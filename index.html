                onComplete?.();
            }
        };

        if (img.complete && img.naturalHeight !== 0) {
            apply(img);
        } else {
            img.onload  = () => apply(img);
            img.onerror = () => {
                LOG.warn('Спрайт не загружен:', filename);
                onComplete?.();
            };
        }
    },

    _replaceImage(inner, newImg, transition = 0) {
        if (!inner) return;
        const existing = inner.querySelector('img');
        newImg.style.cssText = 'display:block;margin:0 auto;';

        const sessionId = this.currentSessionId;

        if (existing && transition > 0) {
            // Кросс-фейд между старым и новым изображением
            Object.assign(newImg.style, {
                position:   'absolute',
                top:        '0',
                left:       '50%',
                transform:  'translateX(-50%)',
                opacity:    '0',
                transition: `opacity ${transition}s ease`
            });
            inner.style.position = 'relative';
            inner.appendChild(newImg);

            requestAnimationFrame(() => requestAnimationFrame(() => {
                newImg.style.opacity         = '1';
                existing.style.transition    = `opacity ${transition}s ease`;
                existing.style.opacity       = '0';
            }));

            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                try { existing.remove(); } catch(e) {}
                newImg.style.cssText = 'display:block;margin:0 auto;';
                inner.style.position = '';
            }, transition * 1000 + 50, sessionId);
        } else if (existing) {
            existing.replaceWith(newImg);
        } else {
            inner.appendChild(newImg);
        }
    },

    _applyChromakeyToImage(img, cb) {
        try {
            const canvas   = this.dom.chromakeyCanvas;
            const ctx      = canvas.getContext('2d');
            canvas.width   = img.naturalWidth  || img.width  || 1;
            canvas.height  = img.naturalHeight || img.height || 1;
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d         = imageData.data;

            const hex = this.chromakeyColor.replace('#', '');
            const r   = parseInt(hex.slice(0, 2), 16);
            const g   = parseInt(hex.slice(2, 4), 16);
            const b   = parseInt(hex.slice(4, 6), 16);
            const tol = this.chromakeyTolerance;

            for (let i = 0; i < d.length; i += 4) {
                const dist = Math.sqrt(
                    (d[i]   - r) ** 2 +
                    (d[i+1] - g) ** 2 +
                    (d[i+2] - b) ** 2
                );
                if (dist < tol)        d[i+3] = 0;
                else if (dist < tol*2) d[i+3] = Math.floor(255 * (dist - tol) / tol);
            }

            ctx.putImageData(imageData, 0, 0);
            const processed    = new Image();
            processed.onload   = () => cb(processed);
            processed.onerror  = () => cb(img); // Фоллбэк: возвращаем оригинал
            processed.src      = canvas.toDataURL('image/png');
        } catch(e) {
            LOG.warn('Chromakey ошибка:', e);
            cb(img);
        }
    },

    _clearSprites(fadeDur, onDone) {
        const { sprites, spritesByFile } = this._getSprites();
        const all = [...Object.values(sprites), ...Object.values(spritesByFile)];

        all.forEach(el => {
            el.classList.add('hiding');
            el.classList.remove('visible');
        });

        const sessionId = this.currentSessionId;
        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this.dom.spritesLayer.innerHTML = '';
            const ctx = this.getContext();
            if (ctx === this) {
                this.sprites       = {};
                this.spritesByFile = {};
            } else {
                ctx.sprites       = {};
                ctx.spritesByFile = {};
            }
            onDone?.();
        }, fadeDur * 1000, sessionId);
    },

    // ============================================================
    // КОМАНДЫ — ФОН
    // ============================================================

cmdBg(cmd) {
    if (!cmd.file) { this._executeNext(); return; }

    const path = this._resolveFilePath(cmd.file, 'bg');
    const url  = path + '?_t=' + Date.now();
    const dur  = cmd.fade || 0.8;

    this.dom.bgNext.style.backgroundImage = `url('${url}')`;
    this.dom.bgNext.style.transition      = `opacity ${dur}s ease-in-out`;
    void this.dom.bgNext.offsetHeight;
    this.dom.bgNext.style.opacity = '1';

    const sessionId = this.currentSessionId;
    this._scheduleTimeout(() => {
        if (this.currentSessionId !== sessionId) return;
        
        // ИСПРАВЛЕНО: очищаем только backgroundColor, не весь background
        this.dom.bgCurrent.style.backgroundImage  = `url('${url}')`;
        this.dom.bgCurrent.style.backgroundColor  = ''; // Только цвет, не всё!
        
        this.dom.bgNext.style.transition         = 'none';
        this.dom.bgNext.style.opacity            = '0';
        this.dom.bgNext.style.backgroundImage    = '';
        
        this._executeNext();
    }, dur * 1000, sessionId);
    },

    cmdBgColor(cmd) {
        const dur = cmd.fade || 0.8;
        // Очищаем фоновое изображение, задаём цвет
        this.dom.bgCurrent.style.backgroundImage = '';
        this.dom.bgNext.style.backgroundImage    = '';
        this.dom.bgNext.style.opacity            = '0';
        this.dom.bgCurrent.style.background      = cmd.color;
        this.dom.bgCurrent.style.transition      = `background ${dur}s ease`;

        const sessionId = this.currentSessionId;
        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this.dom.bgCurrent.style.transition = '';
            this._executeNext();
        }, dur * 1000, sessionId);
    },

    // ============================================================
    // КОМАНДЫ — ПЕРЕХОДЫ
    // ============================================================

    cmdFadeOut(cmd) {
        const dur = cmd.dur || 0.6;
        this.dom.fadeOverlay.style.background  = cmd.color || 'black';
        this.dom.fadeOverlay.style.transition  = `opacity ${dur}s ease-in-out`;
        void this.dom.fadeOverlay.offsetHeight;
        this.dom.fadeOverlay.style.opacity     = '1';

        const sessionId = this.currentSessionId;
        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this._executeNext();
        }, dur * 1000, sessionId);
    },

    cmdFadeIn(cmd) {
        const dur = cmd.dur || 0.6;
        this.dom.fadeOverlay.style.transition  = `opacity ${dur}s ease-in-out`;
        void this.dom.fadeOverlay.offsetHeight;
        this.dom.fadeOverlay.style.opacity     = '0';

        const sessionId = this.currentSessionId;
        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this._executeNext();
        }, dur * 1000, sessionId);
    },

    // ============================================================
    // КОМАНДЫ — АУДИО
    // ============================================================

    cmdMusic(cmd) {
        // Останавливаем текущую музыку
        if (this.currentMusic) {
            if (cmd.fade_out > 0) {
                this._fadeOutAudio(this.currentMusic, cmd.fade_out);
            } else {
                try {
                    this.currentMusic.pause();
                    this.currentMusic.src = '';
                    this.currentMusic.load();
                } catch(e) {}
            }
            this.currentMusic = null;
        }

        if (!cmd.file) { this._executeNext(); return; }

        const path  = this._resolveFilePath(cmd.file, 'music');
        const audio = new Audio(path + '?_t=' + Date.now());
        audio.loop   = true;
        audio.volume = 0;
        if (cmd.start) audio.currentTime = cmd.start;
        this.currentMusic = audio;

        audio.play().then(() => {
            const target = (cmd.volume || 1) * this.settings.volMusic / 100;
            if (cmd.fade_in > 0) {
                this._fadeInAudio(audio, cmd.fade_in, target);
            } else {
                audio.volume = target;
            }
        }).catch(e => LOG.warn('Музыка не воспроизводится:', e));

        this._executeNext();
    },

    cmdAmbient(cmd) {
        // Останавливаем текущий эмбиент
        if (this.currentAmbient) {
            try {
                this.currentAmbient.pause();
                this.currentAmbient.src = '';
                this.currentAmbient.load();
            } catch(e) {}
            this.currentAmbient = null;
        }

        if (!cmd.file) { this._executeNext(); return; }

        const path  = this._resolveFilePath(cmd.file, 'ambient');
        const audio = new Audio(path + '?_t=' + Date.now());
        audio.loop   = true;
        audio.volume = (cmd.volume || 1) * this.settings.volAmbient / 100;
        this.currentAmbient = audio;
        audio.play().catch(e => LOG.warn('Эмбиент не воспроизводится:', e));
        this._executeNext();
    },

    cmdSfx(cmd) {
        if (!cmd.file) { this._executeNext(); return; }
        const path  = this._resolveFilePath(cmd.file, 'sfx');
        const audio = new Audio(path + '?_t=' + Date.now());
        audio.volume = (cmd.volume || 1) * this.settings.volSfx / 100;
        audio.play().catch(e => LOG.warn('SFX не воспроизводится:', e));
        this._executeNext();
    },

    // ============================================================
    // КОМАНДЫ — СПРАЙТЫ
    // ============================================================

    cmdSprite(cmd) {
        if (!cmd.file) { this._executeNext(); return; }

        const { sprites } = this._getSprites();
        const ctx         = this.getContext();
        const spritesObj  = (ctx === this)
            ? (this.sprites = this.sprites || {})
            : ctx.sprites;

        let el    = spritesObj[cmd.id];
        const isNew = !el;

        if (isNew) {
            el            = document.createElement('div');
            el.className  = 'sprite';
            el.dataset.id = cmd.id;
            const inner   = document.createElement('div');
            inner.className = 'sprite-inner';
            el.appendChild(inner);
            this.dom.spritesLayer.appendChild(el);
            spritesObj[cmd.id] = el;
        }

        if (cmd.pos != null) {
            el.style.left = `${this.parsePosition(cmd.pos)}%`;
        }

        const inner = el.querySelector('.sprite-inner');
        const zoom  = cmd.zoom || 1.0;
        inner.style.setProperty('--sprite-scale', zoom);
        inner.style.transform = `scale(${zoom})`;
        el.style.transform    = `translateX(-50%)${cmd.flip ? ' scaleX(-1)' : ''}`;

        this._setSpriteImage(el, cmd.file, cmd.transition || 0, () => {
            if (isNew) {
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    el.classList.add('visible');
                }));
            }
        });

        this._executeNext();
    },

    cmdShow(cmd) {
        if (!cmd.sprite) { this._executeNext(); return; }

        const ctx    = this.getContext();
        const sbf    = (ctx === this)
            ? (this.spritesByFile = this.spritesByFile || {})
            : ctx.spritesByFile;

        let el    = sbf[cmd.sprite];
        const isNew = !el;

        if (isNew) {
            el          = document.createElement('div');
            el.className = 'sprite';
            const inner  = document.createElement('div');
            inner.className = 'sprite-inner';
            el.appendChild(inner);
            this.dom.spritesLayer.appendChild(el);
            sbf[cmd.sprite] = el;
        }

        el.style.left      = `${this.parsePosition(cmd.pos)}%`;
        const inner        = el.querySelector('.sprite-inner');
        const zoom         = cmd.zoom || 1.0;
        inner.style.setProperty('--sprite-scale', zoom);
        inner.style.transform = `scale(${zoom})`;
        el.style.transform = `translateX(-50%)${cmd.flip ? ' scaleX(-1)' : ''}`;

        this._setSpriteImage(el, cmd.sprite, cmd.transition || 0, () => {
            if (isNew) {
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    el.classList.add('visible');
                }));
            }
        });

        this._executeNext();
    },

    cmdHide(cmd) {
        const fadeDur    = (cmd.fade || 0.3) * 1000;
        const ctx        = this.getContext();
        const spritesObj = (ctx === this) ? (this.sprites       || {}) : ctx.sprites;
        const sbfObj     = (ctx === this) ? (this.spritesByFile || {}) : ctx.spritesByFile;

        const hideEl = el => {
            el.classList.add('hiding');
            el.classList.remove('visible');
        };

        const sessionId = this.currentSessionId;

        if (cmd.target === '__all__' || cmd.target === 'all') {
            [...Object.values(spritesObj), ...Object.values(sbfObj)].forEach(hideEl);
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                this.dom.spritesLayer.innerHTML = '';
                if (ctx === this) { this.sprites = {}; this.spritesByFile = {}; }
                else              { ctx.sprites  = {}; ctx.spritesByFile  = {}; }
            }, fadeDur, sessionId);
        } else {
            const el = spritesObj[cmd.target] || sbfObj[cmd.target];
            if (el) {
                hideEl(el);
                this._scheduleTimeout(() => {
                    if (this.currentSessionId !== sessionId) return;
                    try { el.remove(); } catch(e) {}
                    delete spritesObj[cmd.target];
                    delete sbfObj[cmd.target];
                }, fadeDur, sessionId);
            }
        }

        this._executeNext();
    },

    cmdClear(cmd) {
        const fade = cmd.fade || 0.3;
        this._clearSprites(fade, () => this._executeNext());
    },

    cmdMove(cmd) {
        const ctx        = this.getContext();
        const spritesObj = (ctx === this) ? (this.sprites       || {}) : ctx.sprites;
        const sbfObj     = (ctx === this) ? (this.spritesByFile || {}) : ctx.spritesByFile;
        const el         = spritesObj[cmd.target] || sbfObj[cmd.target];

        if (!el) { this._executeNext(); return; }

        const dur = cmd.dur || 0.5;
        el.style.transition = `left ${dur}s cubic-bezier(0.4, 0, 0.2, 1)`;
        requestAnimationFrame(() => {
            el.style.left = `${this.parsePosition(cmd.pos)}%`;
        });

        const sessionId = this.currentSessionId;
        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            el.style.transition = '';
            this._executeNext();
        }, dur * 1000, sessionId);
    },

    // ============================================================
    // КОМАНДЫ — ЭФФЕКТЫ СПРАЙТОВ
    // ============================================================

    cmdFx(cmd) {
        const ctx        = this.getContext();
        const spritesObj = (ctx === this) ? (this.sprites       || {}) : ctx.sprites;
        const sbfObj     = (ctx === this) ? (this.spritesByFile || {}) : ctx.spritesByFile;
        const el         = spritesObj[cmd.target] || sbfObj[cmd.target];
        const inner      = el?.querySelector('.sprite-inner');

        if (!inner) { this._executeNext(); return; }

        const fx  = cmd.effect;
        const dur = cmd.param1 || 0.5;

        // Сбрасываем предыдущую анимацию
        if (this._activeAnimations.has(inner)) {
            this._activeAnimations.delete(inner);
        }
        inner.style.animation = 'none';
        void inner.offsetHeight;

        const sessionId = this.currentSessionId;

        const applyAnim = (cssAnim, clearAfter = null) => {
            inner.style.animation = cssAnim;
            this._activeAnimations.set(inner, { css: cssAnim, started: performance.now() });
            if (clearAfter !== null) {
                this._scheduleTimeout(() => {
                    if (this.currentSessionId !== sessionId) return;
                    inner.style.animation = '';
                    this._activeAnimations.delete(inner);
                }, clearAfter, sessionId);
            }
        };

        const effects = {
            shake:   () => applyAnim(`sprite-shake ${dur}s ease`, dur * 1000),
            pulse:   () => applyAnim(`sprite-pulse ${dur}s ease infinite`, dur * 1000),
            bounce:  () => applyAnim(`sprite-bounce ${dur}s cubic-bezier(0.34,1.56,0.64,1)`, dur * 1000),
            glow:    () => applyAnim(`sprite-glow ${dur}s ease infinite`, dur * 1000),
            tremble: () => applyAnim(`sprite-tremble 0.06s linear infinite`, dur * 1000),
            // float и sway — бесконечные, очищаются только через reset
            float:   () => applyAnim(`sprite-float ${dur}s ease-in-out infinite`, null),
            sway:    () => applyAnim(`sprite-sway ${dur}s ease-in-out infinite`, dur * 1000),
            hop:     () => applyAnim(`sprite-hop 0.3s ease`, 350),
            nod:     () => applyAnim(`sprite-nod 0.4s ease`, 450),

            zoom: () => {
                const scale = dur;
                const time  = cmd.param2 || 0.3;
                inner.style.setProperty('--sprite-scale', scale);
                inner.style.transition = `transform ${time}s cubic-bezier(0.4,0,0.2,1)`;
                requestAnimationFrame(() => {
                    inner.style.transform = `scale(${scale})`;
                });
                // Убираем transition после анимации, не сбрасываем масштаб
                this._scheduleTimeout(() => {
                    if (this.currentSessionId !== sessionId) return;
                    inner.style.transition = '';
                }, time * 1000 + 50, sessionId);
            },

            blur: () => {
                inner.style.filter     = `blur(${dur}px)`;
                inner.style.transition = 'filter 0.3s ease';
                if (cmd.param2) {
                    this._scheduleTimeout(() => {
                        if (this.currentSessionId !== sessionId) return;
                        inner.style.filter = '';
                    }, cmd.param2 * 1000, sessionId);
                }
            },

            gray: () => {
                inner.style.filter     = 'grayscale(100%)';
                inner.style.transition = 'filter 0.3s ease';
                this._scheduleTimeout(() => {
                    if (this.currentSessionId !== sessionId) return;
                    inner.style.filter = '';
                }, dur * 1000, sessionId);
            },

            bright: () => {
                inner.style.filter     = `brightness(${dur})`;
                inner.style.transition = 'filter 0.3s ease';
                if (cmd.param2) {
                    this._scheduleTimeout(() => {
                        if (this.currentSessionId !== sessionId) return;
                        inner.style.filter = '';
                    }, cmd.param2 * 1000, sessionId);
                }
            },

            dim: () => {
                inner.style.filter     = 'brightness(0.6)';
                inner.style.transition = 'filter 0.3s ease';
                this._scheduleTimeout(() => {
                    if (this.currentSessionId !== sessionId) return;
                    inner.style.filter = '';
                }, dur * 1000, sessionId);
            },

            reset: () => {
                inner.style.animation  = '';
                inner.style.filter     = '';
                inner.style.transition = '';
                const scale = inner.style.getPropertyValue('--sprite-scale') || '1';
                inner.style.transform  = `scale(${scale})`;
                this._activeAnimations.delete(inner);
            }
        };

        const handler = effects[fx];
        if (handler) {
            handler();
        } else {
            LOG.warn('Неизвестный fx-эффект:', fx);
        }

        this._executeNext();
    },

    cmdCustomFx(cmd) {
        const ctx        = this.getContext();
        const spritesObj = (ctx === this) ? (this.sprites       || {}) : ctx.sprites;
        const sbfObj     = (ctx === this) ? (this.spritesByFile || {}) : ctx.spritesByFile;
        const el         = spritesObj[cmd.target] || sbfObj[cmd.target];
        const inner      = el?.querySelector('.sprite-inner');

        if (!inner) { this._executeNext(); return; }

        inner.style.animation = 'none';
        void inner.offsetHeight;

        const iterStr = (cmd.iterations === 'infinite') ? 'infinite' : (cmd.iterations || 1);
        const cssAnim = `${cmd.animation} ${cmd.duration}s ${cmd.timing || 'ease'} ${iterStr}`;
        inner.style.animation = cssAnim;
        this._activeAnimations.set(inner, { css: cssAnim, started: performance.now() });

        const sessionId = this.currentSessionId;
        if (!cmd.keep && cmd.iterations !== 'infinite') {
            const totalDur = (cmd.duration || 1) * (typeof iterStr === 'number' ? iterStr : 1);
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                inner.style.animation = '';
                this._activeAnimations.delete(inner);
            }, totalDur * 1000 + 50, sessionId);
        }

        this._executeNext();
    },

    // ============================================================
    // КОМАНДЫ — ВРЕМЯ СУТОК / ЭКРАН
    // ============================================================

    cmdDaytime(cmd) {
        const colors = {
            day:     'transparent',
            sunset:  'rgba(255,90,30,0.22)',
            night:   'rgba(15,15,50,0.45)',
            dawn:    'rgba(255,140,170,0.18)',
            evening: 'rgba(60,40,80,0.28)'
        };
        this.dom.daytimeOverlay.style.background = colors[cmd.time] || 'transparent';
        this._executeNext();
    },

    cmdScreen(cmd) {
        const dur       = cmd.dur || 0.5;
        const sessionId = this.currentSessionId;

        if (cmd.effect === 'shake') {
            this.dom.game.style.animation = 'none';
            void this.dom.game.offsetHeight;
            this.dom.game.style.animation = `screen-shake ${dur}s ease-out`;
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                this.dom.game.style.animation = '';
                this._executeNext();
            }, dur * 1000, sessionId);

        } else if (cmd.effect === 'flash') {
            this.dom.flashOverlay.style.transition = 'none';
            this.dom.flashOverlay.style.opacity    = '1';
            void this.dom.flashOverlay.offsetHeight;
            this.dom.flashOverlay.style.transition = `opacity ${dur}s ease-out`;
            this.dom.flashOverlay.style.opacity    = '0';
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                this._executeNext();
            }, dur * 1000, sessionId);

        } else {
            LOG.warn('Неизвестный screen-эффект:', cmd.effect);
            this._executeNext();
        }
    },

    // ============================================================
    // КОМАНДЫ — РАСШИРЕННЫЕ (v3)
    // ============================================================

    cmdChapter(cmd) {
        const dur       = cmd.duration || 2.8;
        const sessionId = this.currentSessionId;

        // Скрываем текстбокс и спрайты перед заставкой главы
        this._setUIState('transition');

        this.dom.chapterOverlay.style.background  = cmd.bg || '#000000';
        this.dom.chapterSubtitle.textContent       = cmd.subtitle || '';
        this.dom.chapterTitleText.textContent      = cmd.title    || '';
        this.dom.chapterOverlay.classList.add('visible');

        // Сбрасываем историю прыжков при новой главе
        this._jumpHistory = [];

        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this.dom.chapterOverlay.classList.remove('visible');
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                this._executeNext();
            }, 850, sessionId);
        }, dur * 1000, sessionId);
    },

    cmdScene(cmd) {
        // Фикс "призрака текстбокса": скрываем UI до смены сцены
        this._setUIState('transition');

        const sub = [];

        // Очищаем спрайты перед сменой фона
        if (cmd.bg || cmd.music || cmd.ambient || cmd.daytime) {
            sub.push({ cmd: 'clear', fade: 0.2 });
            sub.push({ cmd: 'wait',  dur:  0.25 });
        }

        if (cmd.bg)      sub.push({ cmd: 'bg',      file: Resources.resolve(cmd.bg,      'bg'),      fade: cmd.fade });
        if (cmd.music)   sub.push({ cmd: 'music',   file: Resources.resolve(cmd.music,   'music'),   fade_in: 2, fade_out: 1, volume: 1.0 });
        if (cmd.ambient) sub.push({ cmd: 'ambient', file: Resources.resolve(cmd.ambient, 'ambient'), volume: 0.5 });
        if (cmd.daytime) sub.push({ cmd: 'daytime', time: cmd.daytime });

        this.commands.splice(this.cmdIndex, 0, ...sub);
        this._executeNext();
    },

    cmdFullscreenText(cmd) {
        const dur       = cmd.duration || 3.0;
        const sessionId = this.currentSessionId;

        // Скрываем текстбокс
        this._setUIState('transition');

        this.dom.fsTextOverlay.style.background    = cmd.bg       || '#000000';
        this.dom.fsTextContent.style.color         = cmd.color    || '#ffffff';
        this.dom.fsTextContent.style.fontSize      = cmd.fontSize || '2em';
        this.dom.fsTextContent.textContent         = cmd.text     || '';
        this.dom.fsTextOverlay.classList.add('visible');

        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this.dom.fsTextOverlay.classList.remove('visible');
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                this._executeNext();
            }, 650, sessionId);
        }, dur * 1000, sessionId);
    },

    // ============================================================
    // КОМАНДЫ — МНОГОФАЙЛОВОСТЬ
    // ============================================================

    async cmdInclude(cmd) {
        if (!this.currentModId) {
            LOG.warn('include() работает только в папочных модах');
            this._executeNext();
            return;
        }

        const mod = this.currentMod;
        const url = mod.basePath + cmd.file;

        // Защита от повторного включения одного файла
        if (this._includedFiles.has(url)) {
            LOG.warn('include: файл уже включён, пропускаем:', url);
            this._executeNext();
            return;
        }

        try {
            const res = await fetchNoCache(url);
            if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + url);
            const code   = await res.text();
            const parser = new ScenarioParser(this.currentModId);
            const data   = parser.parse(code);

            this._includedFiles.add(url);
            this.commands.splice(this.cmdIndex, 0, ...data.commands);
            this._indexLabels(this.commands);

            this._executeNext();
        } catch(e) {
            LOG.error('include:', cmd.file, e);
            this._executeNext();
        }
    },

    async cmdCall(cmd) {
        if (!this.currentModId) {
            LOG.warn('call() работает только в папочных модах');
            this._executeNext();
            return;
        }

        // Защита от переполнения стека
        if (this.callStack.length >= this.maxCallDepth) {
            LOG.error('Превышена глубина вложенности call():', this.callStack.length);
            this._executeNext();
            return;
        }

        const mod = this.currentMod;
        const url = mod.basePath + cmd.file;

        try {
            const res = await fetchNoCache(url);
            if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + url);
            const code   = await res.text();
            const parser = new ScenarioParser(this.currentModId);
            const data   = parser.parse(code);

            // Сохраняем текущее состояние выполнения
            this.callStack.push({
                commands: this.commands,
                index:    this.cmdIndex,
                labels:   { ...this._getLabels() }
            });

            this.commands = data.commands;
            this.cmdIndex = 0;

            // Индексируем метки нового файла
            const newLabels = {};
            data.commands.forEach((c, i) => { if (c.cmd === 'label') newLabels[c.name] = i; });
            const ctx = this.getContext();
            if (ctx === this) this.labels = newLabels;
            else              ctx.labels  = newLabels;

            // Если указана метка входа — прыгаем сразу
            if (cmd.label && newLabels[cmd.label] !== undefined) {
                this.cmdIndex = newLabels[cmd.label];
            }

            this._executeNext();
        } catch(e) {
            LOG.error('call:', cmd.file, e);
            this._executeNext();
        }
    },

    cmdReturnFromCall() {
        if (!this.callStack.length) {
            LOG.warn('return_from_call() без соответствующего call()');
            this._executeNext();
            return;
        }

        const state   = this.callStack.pop();
        this.commands = state.commands;
        this.cmdIndex = state.index;

        // Восстанавливаем метки вызывающего контекста
        const ctx = this.getContext();
        if (ctx === this) this.labels = state.labels;
        else              ctx.labels  = state.labels;

        this._executeNext();
    },

    cmdCustomHook(cmd) {
        const modId = this.currentModId;
        if (!modId) { this._executeNext(); return; }

        if (cmd.type === 'js') {
            try {
                const fn = window.ModHooks?.[modId]?.[cmd.func];
                if (typeof fn !== 'function') {
                    LOG.warn('custom_hook: функция не найдена:', cmd.func, 'в моде:', modId);
                } else {
                    // Таймаут-защита от зависания пользовательского кода
                    let finished = false;
                    const guard  = setTimeout(() => {
                        if (!finished) LOG.error('custom_hook timeout (>5s):', cmd.func);
                    }, 5000);

                    fn(...(cmd.args || []));

                    finished = true;
                    clearTimeout(guard);
                }
            } catch(e) {
                LOG.error('custom_hook JS ошибка:', cmd.func, e);
            }
        } else if (cmd.type === 'css') {
            this.addCustomCSS(cmd.args?.[0] || '');
        } else {
            LOG.warn('custom_hook: неизвестный тип:', cmd.type);
        }

        this._executeNext();
    },

    // ============================================================
    // КОМАНДЫ — ДИАЛОГ
    // ============================================================

    cmdSay(cmd) {
        this.dom.speaker.textContent = cmd.name  || '';
        this.dom.speaker.style.color = cmd.color || '#fff';
        this.fullText                = cmd.text  || '';
        this.currentTextIndex        = 0;
        this.waitingForClick         = false;
        this.dom.dialogue.textContent = '';

        if (this.settings.textSpeed >= 100) {
            // Мгновенный вывод текста
            this.dom.dialogue.textContent = this.fullText;
            this.isTyping = false;
            this._setUIState('waiting');
            this._finishText();
        } else {
            this._setUIState('typing');
            this.isTyping = true;
            this._typeText();
        }
    },

    _typeText() {
        if (!this.isTyping) return;

        if (this.currentTextIndex < this.fullText.length) {
            this.dom.dialogue.textContent += this.fullText[this.currentTextIndex++];
            // Скорость печати: от 10мс (быстро) до ~50мс (медленно)
            const delay = Math.max(10, 60 - this.settings.textSpeed * 0.55);
            const sessionId = this.currentSessionId;
            this.typeAnimationId = this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                this._typeText();
            }, delay, sessionId);
        } else {
            this.isTyping = false;
            this._setUIState('waiting');
            this._finishText();
        }
    },

    _finishTyping() {
        if (this.typeAnimationId) {
            clearTimeout(this.typeAnimationId);
            this._activeTimers.delete(this.typeAnimationId);
            this.typeAnimationId = null;
        }
        this.isTyping = false;
        this.dom.dialogue.textContent = this.fullText;
        this._setUIState('waiting');
        this._finishText();
    },

    _finishText() {
        this.waitingForClick = true;
    },

    // ============================================================
    // КОМАНДЫ — ВЫБОР
    // ============================================================

    cmdChoice(cmd) {
        const c = this.dom.choiceContainer;
        c.innerHTML = '';

        // Скрываем текстбокс перед выбором
        this._setUIState('choice');

        const labels = this._getLabels();

        cmd.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className   = 'choice-btn';
            btn.textContent = opt.text;
            // Начальное состояние для анимации появления
            btn.style.opacity   = '0';
            btn.style.transform = 'translateY(10px)';

            btn.onclick = () => {
                this.dom.choiceContainer.classList.remove('visible');
                this._setUIState('transition');

                if (labels[opt.target] !== undefined) {
                    this.cmdIndex = labels[opt.target];
                } else {
                    LOG.warn('choice: метка не найдена:', opt.target);
                }
                this._executeNext();
            };

            c.appendChild(btn);

            // Плавное появление кнопок с задержкой
            const sessionId = this.currentSessionId;
            this._scheduleTimeout(() => {
                if (this.currentSessionId !== sessionId) return;
                btn.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
                btn.style.opacity    = '1';
                btn.style.transform  = 'translateY(0)';
            }, i * 80, sessionId);
        });
    },

    // ============================================================
    // КОМАНДЫ — ПРЫЖКИ (с защитой от зацикливания)
    // ============================================================

    cmdJump(cmd) {
        const labels = this._getLabels();

        if (labels[cmd.target] === undefined) {
            LOG.warn('jump: метка не найдена:', cmd.target, '— выполнение продолжается линейно');
            this._executeNext();
            return;
        }

        // Защита от бесконечного цикла
        this._jumpHistory.push(cmd.target);

        if (this._jumpHistory.length > this._maxJumpCount) {
            // Проверяем последние 20 прыжков на повторяемость
            const recent  = this._jumpHistory.slice(-20);
            const allSame = recent.every(l => l === cmd.target);

            if (allSame) {
                LOG.error('Обнаружен бесконечный цикл на метке:', cmd.target, '— сценарий принудительно завершён');
                this._endScenario();
                return;
            }

            // Общая проверка: слишком много прыжков — тоже нехорошо
            if (this._jumpHistory.length > this._maxJumpCount * 2) {
                LOG.error('Слишком много прыжков (>' + (this._maxJumpCount * 2) + ') — сценарий принудительно завершён');
                this._endScenario();
                return;
            }
        }

        this.cmdIndex = labels[cmd.target];
        this._executeNext();
    },

    // ============================================================
    // КОМАНДЫ — УСЛОВИЯ
    // ============================================================

    cmdIf(cmd) {
        const ctx  = this.getContext();
        const vars = (ctx === this) ? (this.variables || {}) : ctx.variables;

        if (vars[cmd.var] && cmd.then?.length) {
            // Вставляем команды then прямо в текущую очередь
            this.commands.splice(this.cmdIndex, 0, ...cmd.then);
        }
        this._executeNext();
    },

    cmdIfCmp(cmd) {
        const ctx  = this.getContext();
        const vars = (ctx === this) ? (this.variables || {}) : ctx.variables;
        const v    = vars[cmd.var] ?? 0;

        const ops = {
            '>=': () => v >= cmd.val,
            '<=': () => v <= cmd.val,
            '>':  () => v >  cmd.val,
            '<':  () => v <  cmd.val,
            '==': () => v === cmd.val,
            '!=': () => v !== cmd.val
        };

        const check = ops[cmd.op];
        if (!check) {
            LOG.warn('if_cmp: неизвестный оператор:', cmd.op);
            this._executeNext();
            return;
        }

        if (check() && cmd.then?.length) {
            // Вставляем команды then прямо в текущую очередь
            this.commands.splice(this.cmdIndex, 0, ...cmd.then);
        }
        this._executeNext();
    },

    // ============================================================
    // ЗАВЕРШЕНИЕ СЦЕНАРИЯ
    // ============================================================

    _endScenario() {
        const modId = this.currentModId;

        // Убиваем сессию — останавливает все таймеры, аудио и анимации
        this._killCurrentSession();

        this.isRunning       = false;
        this.isPaused        = false;
        this.isTyping        = false;
        this.waitingForClick = false;

        if (this.typeAnimationId) {
            clearTimeout(this.typeAnimationId);
            this.typeAnimationId = null;
        }

        const sessionId = this.currentSessionId;

        // Плавное затухание fade-оверлея перед возвратом в меню
        this.dom.fadeOverlay.style.transition = 'opacity 0.8s ease';
        void this.dom.fadeOverlay.offsetHeight;
        this.dom.fadeOverlay.style.opacity    = '0';

        if (modId) this._cleanupMod(modId);
        this.currentModId = null;
        this.currentMod   = null;
        this.callStack    = [];
        this._jumpHistory = [];

        this._scheduleTimeout(() => {
            if (this.currentSessionId !== sessionId) return;
            this.dom.menu.classList.remove('hidden');
            this._initMenu();
        }, 800, sessionId);
    }
};

// ============================================================
// СТАРТ
// ============================================================

document.addEventListener('DOMContentLoaded', () => VN.init());
</script>

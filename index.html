<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VN Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Raleway:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --textbox-width: 72%;
    --textbox-height: 24vh;
    --transition-fast: 0.12s;
    --transition-normal: 0.3s;
    --transition-slow: 0.6s;
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0f; font-family: 'Raleway', sans-serif;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* ── Фоны ── */
.bg-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    will-change: opacity, transform;
}
#bg-current { z-index: 1; }
#bg-next    { z-index: 2; opacity: 0; pointer-events: none; }

/* ── Спрайты ── */
#sprites-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.sprite {
    position: absolute;
    bottom: -25vh;
    will-change: transform, opacity, left;
    opacity: 0;
    transition: opacity 0.4s ease-out;
    pointer-events: none;
}
.sprite.visible { opacity: 1; }
.sprite.hiding  { opacity: 0; transition: opacity 0.3s ease-out; }

.sprite-inner {
    transform-origin: center top;
    will-change: transform, filter;
    transition: transform 0.3s var(--ease-smooth), filter 0.3s ease;
}

.sprite img {
    display: block;
    height: 125vh;
    width: auto;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    margin: 0 auto;
}
.sprite { transform: translateX(-50%); }

/* ── Оверлеи ── */
#daytime-overlay {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    transition: background var(--transition-slow) var(--ease-smooth);
}

#flash-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #fff;
    opacity: 0;
    pointer-events: none;
}

#fade-overlay {
    position: absolute;
    inset: 0;
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    background: #000;
}

/* ── Текстбокс ── */
#textbox {
    position: absolute;
    bottom: 2.5vh;
    left: 50%;
    transform: translateX(-50%);
    width: var(--textbox-width);
    max-width: 1100px;
    min-height: var(--textbox-height);
    z-index: 50;
    background: linear-gradient(
        180deg,
        rgba(8, 8, 20, 0.88) 0%,
        rgba(8, 8, 20, 0.94) 100%
    );
    border-radius: 16px;
    padding: 1.6em 2.5em 1.8em;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal) var(--ease-out);
    box-shadow:
        0 -4px 30px rgba(0,0,0,0.4),
        0 8px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
}
#textbox.visible { opacity: 1; pointer-events: auto; }

#speaker {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: clamp(1.2em, 2.8vw, 1.5em);
    font-weight: 600;
    margin-bottom: 0.5em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    letter-spacing: 0.5px;
    min-height: 1.4em;
    transition: color var(--transition-fast) ease;
}

#dialogue {
    font-family: 'Merriweather', Georgia, serif;
    font-size: clamp(1.1em, 2.4vw, 1.35em);
    line-height: 1.75;
    color: rgba(255,255,255,0.94);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    flex: 1;
    overflow: hidden;
}

#continue-indicator {
    position: absolute;
    bottom: 1em;
    right: 2em;
    width: 12px;
    height: 12px;
    opacity: 0;
    transition: opacity var(--transition-fast) ease;
}
#continue-indicator.visible { opacity: 0.6; }

#continue-indicator::before,
#continue-indicator::after {
    content: '';
    position: absolute;
    left: 0;
    width: 12px;
    height: 2px;
    background: #fff;
    border-radius: 1px;
}
#continue-indicator::before {
    top: 4px;
    transform: rotate(45deg);
    transform-origin: left center;
}
#continue-indicator::after {
    top: 4px;
    transform: rotate(-45deg);
    transform-origin: right center;
    left: auto; right: 0;
}
#continue-indicator.visible { animation: indicator-bounce 1s ease-in-out infinite; }

@keyframes indicator-bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(3px); }
}

/* ── Выборы ── */
#choice-container {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    gap: 0.9em;
    z-index: 60;
    min-width: 300px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal) var(--ease-out);
}
#choice-container.visible { opacity: 1; pointer-events: auto; }

.choice-btn {
    padding: 1.1em 2.2em;
    font-family: 'Raleway', sans-serif;
    font-size: clamp(1.05em, 2.2vw, 1.2em);
    font-weight: 600;
    background: rgba(15, 15, 30, 0.9);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    border-radius: 10px;
    transition: all var(--transition-fast) var(--ease-smooth);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transform: translateY(0);
}
.choice-btn:hover {
    background: rgba(45, 45, 80, 0.95);
    border-color: rgba(255,255,255,0.35);
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 25px rgba(0,0,0,0.4);
}
.choice-btn:active { transform: translateY(0) scale(0.98); }

/* ── Главное меню ── */
#menu {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    opacity: 1;
    transition: opacity var(--transition-normal) var(--ease-out);
}
#menu.hidden { opacity: 0; pointer-events: none; }

#menu-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(4px) brightness(0.55);
}

#menu-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
}

#menu-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1em;
}

#menu-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.2em, 8vw, 4.5em);
    font-weight: 700;
    color: #fff;
    margin-bottom: 1.4em;
    text-shadow:
        2px 2px 0 rgba(0,0,0,0.9),
        4px 4px 25px rgba(0,0,0,0.9),
        0 0 50px rgba(80,80,130,0.35);
    letter-spacing: 3px;
    text-align: center;
}

.menu-btn {
    padding: 1em 2.8em;
    font-family: 'Raleway', sans-serif;
    font-size: clamp(1.05em, 2.5vw, 1.25em);
    font-weight: 600;
    background: rgba(20, 20, 40, 0.85);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    cursor: pointer;
    border-radius: 10px;
    min-width: 260px;
    transition: all var(--transition-fast) var(--ease-smooth);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.menu-btn:hover {
    background: rgba(50,50,85,0.9);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

/* ── Панели (общий стиль) ── */
.panel {
    position: absolute;
    inset: 0;
    background: rgba(8, 8, 18, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 250;
    padding: 2em;
    backdrop-filter: blur(15px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal) var(--ease-out);
}
.panel.active { opacity: 1; pointer-events: auto; }

.panel-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.6em, 4vw, 2.2em);
    font-weight: 700;
    color: #fff;
    margin-bottom: 1.5em;
}

/* ── Настройки ── */
.option-row {
    display: flex;
    align-items: center;
    gap: 1.5em;
    width: 100%;
    max-width: 420px;
    margin-bottom: 1em;
}
.option-label {
    flex: 1;
    font-size: clamp(0.95em, 2vw, 1.1em);
    color: #bbb;
    font-weight: 500;
}
.option-input { flex: 1.3; }

input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a0b0ff, #7080dd);
    box-shadow: 0 2px 8px rgba(100,120,200,0.4);
    transition: transform 0.1s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }

.option-value {
    width: 50px;
    text-align: right;
    color: #888;
    font-size: 1em;
    font-weight: 500;
}

.back-btn {
    margin-top: 1.8em;
    padding: 0.8em 2.2em;
    font-size: 1.05em;
    font-weight: 600;
    background: rgba(60,30,35,0.85);
    border: 1px solid rgba(255,120,130,0.25);
    color: #ffbbbb;
    cursor: pointer;
    border-radius: 8px;
    transition: all var(--transition-fast);
}
.back-btn:hover {
    background: rgba(90,45,50,0.9);
    border-color: rgba(255,130,140,0.45);
}

/* ── Список сценариев/модов ── */
#scenarios-container {
    display: flex;
    flex-direction: column;
    gap: 0.7em;
    max-height: 55vh;
    overflow-y: auto;
    padding: 0.5em;
    width: 100%;
    max-width: 520px;
}

.scenario-btn {
    padding: 1em 2.2em;
    font-size: clamp(1em, 2vw, 1.1em);
    font-weight: 500;
    background: rgba(35,35,55,0.85);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    cursor: pointer;
    border-radius: 8px;
    transition: all var(--transition-fast);
    min-width: 240px;
    text-align: left;
    width: 100%;
}
.scenario-btn:hover {
    background: rgba(60,60,90,0.9);
    border-color: rgba(255,255,255,0.35);
    transform: translateY(-1px);
}

/* Карточка мода с метаданными */
.mod-card {
    display: flex;
    flex-direction: column;
    gap: 0.25em;
}
.mod-card-title {
    font-size: 1.05em;
    font-weight: 600;
    color: #fff;
}
.mod-card-meta {
    font-size: 0.82em;
    color: #888;
    font-weight: 400;
}
.mod-card-tag {
    display: inline-block;
    font-size: 0.72em;
    padding: 0.1em 0.5em;
    border-radius: 4px;
    background: rgba(100,100,160,0.35);
    border: 1px solid rgba(150,150,220,0.25);
    color: #aab;
    margin-right: 0.4em;
    font-weight: 500;
}

/* ── Загрузка ── */
#click-area {
    position: absolute;
    inset: 0;
    z-index: 45;
    cursor: pointer;
    pointer-events: none;
}
#click-area.active { pointer-events: auto; }

#loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
#loading-overlay.visible { opacity: 1; pointer-events: auto; }

#loading-text {
    color: #fff;
    font-size: 1.3em;
    font-weight: 500;
}

.loading-bar-wrap {
    width: 280px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
}
.loading-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7080dd, #a0b0ff);
    border-radius: 2px;
    transition: width 0.2s ease;
}

/* ── Пауза ── */
#pause-menu {
    position: absolute;
    inset: 0;
    z-index: 400;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal) var(--ease-out);
}
#pause-menu.visible { opacity: 1; pointer-events: auto; }

#pause-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
}

#pause-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1em;
    background: rgba(10,10,25,0.92);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 2.5em 3.5em;
    box-shadow:
        0 8px 50px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.06);
    min-width: 300px;
}

#pause-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.5em, 4vw, 2em);
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.6em;
    letter-spacing: 2px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.8);
}

.pause-btn {
    width: 100%;
    padding: 0.95em 2em;
    font-family: 'Raleway', sans-serif;
    font-size: clamp(1em, 2.2vw, 1.15em);
    font-weight: 600;
    background: rgba(30,30,55,0.9);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    cursor: pointer;
    border-radius: 10px;
    transition: all var(--transition-fast) var(--ease-smooth);
    backdrop-filter: blur(8px);
    box-shadow: 0 3px 15px rgba(0,0,0,0.3);
    text-align: center;
}
.pause-btn:hover {
    background: rgba(55,55,95,0.95);
    border-color: rgba(255,255,255,0.32);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.4);
}
.pause-btn:active { transform: translateY(0) scale(0.98); }
.pause-btn.danger {
    background: rgba(55,20,25,0.88);
    border-color: rgba(255,100,110,0.2);
    color: #ffbbbb;
}
.pause-btn.danger:hover {
    background: rgba(85,35,40,0.95);
    border-color: rgba(255,120,130,0.4);
}

/* Настройки внутри паузы */
#pause-options-panel {
    position: absolute;
    inset: 0;
    background: rgba(8,8,18,0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 410;
    padding: 2em;
    backdrop-filter: blur(15px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal) var(--ease-out);
}
#pause-options-panel.active { opacity: 1; pointer-events: auto; }

/* ── Оверлей главы ── */
#chapter-overlay {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.5em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    background: #000;
}
#chapter-overlay.visible { opacity: 1; }

#chapter-title-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2em, 6vw, 3.5em);
    font-weight: 700;
    color: #fff;
    text-align: center;
    text-shadow: 0 4px 30px rgba(0,0,0,0.9);
    letter-spacing: 2px;
    padding: 0 1em;
}

#chapter-subtitle-text {
    font-family: 'Raleway', sans-serif;
    font-size: clamp(1em, 2.5vw, 1.4em);
    font-weight: 400;
    color: rgba(255,255,255,0.6);
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* ── Полноэкранный текст ── */
#fullscreen-text-overlay {
    position: absolute;
    inset: 0;
    z-index: 490;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
}
#fullscreen-text-overlay.visible { opacity: 1; }

#fullscreen-text-content {
    color: #fff;
    text-align: center;
    white-space: pre-line;
    padding: 2em;
    max-width: 80%;
    font-family: 'Merriweather', serif;
    line-height: 1.75;
}

/* ── Кастомные анимации спрайтов ── */
@keyframes sprite-shake {
    0%, 100% { transform: translateX(0) rotate(0) scale(var(--sprite-scale, 1)); }
    15% { transform: translateX(-5px) rotate(-0.5deg) scale(var(--sprite-scale, 1)); }
    30% { transform: translateX(5px) rotate(0.5deg) scale(var(--sprite-scale, 1)); }
    45% { transform: translateX(-4px) rotate(-0.3deg) scale(var(--sprite-scale, 1)); }
    60% { transform: translateX(4px) rotate(0.3deg) scale(var(--sprite-scale, 1)); }
    75% { transform: translateX(-2px) rotate(-0.1deg) scale(var(--sprite-scale, 1)); }
    90% { transform: translateX(2px) rotate(0.1deg) scale(var(--sprite-scale, 1)); }
}
@keyframes sprite-pulse {
    0%, 100% { transform: scale(var(--sprite-scale, 1)); }
    50% { transform: scale(calc(var(--sprite-scale, 1) * 1.04)); }
}
@keyframes sprite-bounce {
    0%, 100% { transform: translateY(0) scale(var(--sprite-scale, 1)); }
    35% { transform: translateY(-22px) scale(var(--sprite-scale, 1)); }
    55% { transform: translateY(-18px) scale(var(--sprite-scale, 1)); }
    75% { transform: translateY(-22px) scale(var(--sprite-scale, 1)); }
}
@keyframes sprite-glow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
    50% { filter: brightness(1.15) drop-shadow(0 0 25px rgba(255,255,200,0.5)); }
}
@keyframes sprite-tremble {
    0%, 100% { transform: translateX(0) scale(var(--sprite-scale, 1)); }
    25% { transform: translateX(-2px) scale(var(--sprite-scale, 1)); }
    75% { transform: translateX(2px) scale(var(--sprite-scale, 1)); }
}
@keyframes sprite-float {
    0%, 100% { transform: translateY(0) scale(var(--sprite-scale, 1)); }
    50% { transform: translateY(-12px) scale(var(--sprite-scale, 1)); }
}
@keyframes sprite-sway {
    0%, 100% { transform: rotate(0deg) scale(var(--sprite-scale, 1)); }
    25% { transform: rotate(1.5deg) scale(var(--sprite-scale, 1)); }
    75% { transform: rotate(-1.5deg) scale(var(--sprite-scale, 1)); }
}
@keyframes sprite-hop {
    0%, 100% { transform: translateY(0) scale(var(--sprite-scale, 1)); }
    50% { transform: translateY(-8px) scale(calc(var(--sprite-scale, 1) * 1.02)); }
}
@keyframes sprite-nod {
    0%, 100% { transform: translateY(0) scale(var(--sprite-scale, 1)); }
    30% { transform: translateY(5px) scale(var(--sprite-scale, 1)); }
    60% { transform: translateY(3px) scale(var(--sprite-scale, 1)); }
}
@keyframes screen-shake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-7px, -4px); }
    20% { transform: translate(6px, 3px); }
    30% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -3px); }
    50% { transform: translate(-4px, 4px); }
    60% { transform: translate(4px, -2px); }
    70% { transform: translate(-2px, 2px); }
    80% { transform: translate(2px, -1px); }
    90% { transform: translate(-1px, 1px); }
}

#chromakey-canvas { display: none; }
#custom-styles    { display: none; }
</style>
</head>
<body>
<div id="game">
    <div id="bg-current" class="bg-layer"></div>
    <div id="bg-next"    class="bg-layer"></div>
    <div id="sprites-layer"></div>
    <div id="daytime-overlay"></div>
    <div id="flash-overlay"></div>
    <div id="fade-overlay"></div>
    <div id="click-area"></div>

    <!-- Оверлей главы -->
    <div id="chapter-overlay">
        <div id="chapter-subtitle-text"></div>
        <div id="chapter-title-text"></div>
    </div>

    <!-- Полноэкранный текст -->
    <div id="fullscreen-text-overlay">
        <div id="fullscreen-text-content"></div>
    </div>

    <div id="textbox">
        <div id="speaker"></div>
        <div id="dialogue"></div>

<script>
'use strict';

// ============================================================
// КОНСТАНТЫ
// ============================================================

const FALLBACKS = {
    bg:        'ext_beach_sunset.jpg',
    sprites:   'рита_весёлая_приветствует.png',
    music:     'a_promise_from_distant_days.ogg',

            manifest: { name: 'БЛ2: Шесть Пальцев Судьбы', entry: 'main.py' },
            files:    ['main.py'],
            assets:   {}
        }
    ]
};

const TEST_SCENARIO = `

// ============================================================
// УТИЛИТЫ
// ============================================================

function fetchNoCache(url, options = {}) {
    const sep = url.includes('?') ? '&' : '?';
    return fetch(`${url}${sep}_t=${Date.now()}`, {
        ...options,
        headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            ...(options.headers || {})
        },
        cache: 'no-store'
    });
}

// Простой дебаг-логгер (включается через VN.debug = true)
const LOG = {
    _on: false,
    info:  (...a) => { if (LOG._on) console.log  ('[VN]', ...a); },
    warn:  (...a) => {                console.warn ('[VN]', ...a); },
    error: (...a) => {                console.error('[VN]', ...a); }
};

// ============================================================
// МЕНЕДЖЕР РЕСУРСОВ
// ============================================================

const Resources = {
    data:   null,   // данные от /api/resources
    hasApi: false,

    async init() {
        try {
            const res = await fetchNoCache('/api/resources');
            if (!res.ok) throw new Error('no api');
            this.data   = await res.json();
            this.hasApi = true;
            LOG.info('Локальный сервер — полный доступ к ресурсам');
        } catch {
            this.data   = null;
            this.hasApi = false;
            LOG.info('API недоступен — браузерный режим, используем фоллбэки');
        }
    },

    getRandom(category) {
        if (this.hasApi && this.data?.[category]?.length > 0) {
            const list = this.data[category];
            return list[Math.floor(Math.random() * list.length)];
        }
        return FALLBACKS[category] || null;
    },

    resolve(str, category) {
        if (!str) return str;
        if (str === '__random__') return this.getRandom(category);
        return str;
    },

    // Путь к ресурсу с учётом мода
    // modAssets — объект ресурсов мода (или null)
    resolveModPath(filename, category, modId, modAssets) {
        if (!filename) return null;

        // Если путь начинается с assets/ — это собственный ресурс мода
        if (filename.startsWith('assets/') && modId) {
            return `scenarios/${modId}/${filename}`;
        }

        // Если мод объявил свои ресурсы — ищем там
        if (modAssets && modAssets[category]) {
            const found = modAssets[category].find(f => f.endsWith('/' + filename) || f === filename);
            if (found) return `scenarios/${modId}/${found}`;
        }

        // Иначе — глобальные папки
        const prefix = { sprites: 'sprites/', bg: 'bg/', music: 'audio/music/', ambient: 'audio/ambient/', sfx: 'audio/sfx/' };
        return (prefix[category] || '') + filename;
    }
};

// ============================================================
// МЕНЕДЖЕР МОДОВ
// ============================================================

const ModManager = {
    mods: new Map(),    // id → объект мода

    /*
     * Объект мода:
     * {
     *   id:       string,
     *   type:     'folder' | 'single-file',
     *   manifest: object | null,
     *   entryFile: string,        // 'main.py' или 'rita.py'
     *   files:    string[],       // все py-файлы мода
     *   assets:   { sprites, bg, music, ... } | {},
     *   basePath: string,         // 'scenarios/rita/' или 'scenarios/'
     *   custom:   { js, css } | {}
     * }
     */

    async scanMods() {
        this.mods.clear();

        if (Resources.hasApi) {
            await this._scanLocal();
        } else {
            this._scanBrowser();
        }

        LOG.info('Модов найдено:', this.mods.size, [...this.mods.keys()]);
    },

    // ── Локальный режим: смотрим на /api/resources и структуру путей ──
    async _scanLocal() {
        const data = Resources.data;

        // Сценарии возвращаются как пути вида:
        //   "rita/main.py"         (папочный мод)
        //   "legacy_story.py"      (одиночный файл)
        const scenarios = data?.scenarios || [];

        // Группируем по папке (первый сегмент пути)
        const folders = new Map();   // folderName → [файлы]
        const singles = [];

        for (const s of scenarios) {
            const slashIdx = s.indexOf('/');
            if (slashIdx !== -1) {
                const folder = s.slice(0, slashIdx);
                const file   = s.slice(slashIdx + 1);
                if (!folders.has(folder)) folders.set(folder, []);
                folders.get(folder).push(file);
            } else {
                singles.push(s);
            }
        }

        // Папочные моды
        for (const [folder, files] of folders) {
            const manifest = await this._tryLoadManifest(folder);
            const entryFile = manifest?.entry ?? (files.includes('main.py') ? 'main.py' : files[0]);
            const assets    = await this._scanModAssets(folder);
            this.mods.set(folder, {
                id:        folder,
                type:      'folder',
                manifest,
                entryFile,
                files,
                assets,
                basePath:  `scenarios/${folder}/`,
                custom:    manifest?.custom ?? {}
            });
        }

        // Одиночные файлы (legacy)
        for (const s of singles) {
            const id = s.replace(/\.py$/i, '');
            this.mods.set(id, {
                id,
                type:      'single-file',
                manifest:  null,
                entryFile: s,
                files:     [s],
                assets:    {},
                basePath:  'scenarios/',
                custom:    {}
            });
        }
    },

    // ── Браузерный режим: используем FALLBACKS.mods ──
    _scanBrowser() {
        for (const mod of FALLBACKS.mods) {
            this.mods.set(mod.id, {
                id:        mod.id,
                type:      mod.type ?? 'folder',
                manifest:  mod.manifest ?? null,
                entryFile: mod.manifest?.entry ?? 'main.py',
                files:     mod.files ?? [],
                assets:    mod.assets ?? {},
                basePath:  `scenarios/${mod.id}/`,
                custom:    mod.manifest?.custom ?? {}
            });
        }
    },

    // Пытаемся загрузить mod.json для папочного мода
    async _tryLoadManifest(modId) {
        try {
            const res = await fetchNoCache(`scenarios/${modId}/mod.json`);
            if (!res.ok) return null;
            return await res.json();
        } catch {
            return null;
        }
    },

    // Сканируем ресурсы мода из данных API
    // (ищем пути вида "scenarios/modId/assets/...")
    async _scanModAssets(modId) {
        const data = Resources.data;
        if (!data) return {};

        const assets = { sprites: [], bg: [], music: [], ambient: [], sfx: [] };
        // Не сканируем — ресурсы мода лежат в его папке и резолвятся через resolveModPath.
        // Здесь можно расширить при необходимости.
        return assets;
    },

    getModList() {
        return [...this.mods.values()];
    },

    getMod(id) {
        return this.mods.get(id) || null;
    }
};

// ============================================================
// ПАРСЕР СЦЕНАРИЕВ
// ============================================================

class ScenarioParser {
    constructor(modId = null) {
        this.modId      = modId;     // для разрешения путей
        this.commands   = [];
        this.characters = {};
        this.customCSS  = [];
    }

    parse(code) {
        this.commands   = [];
        this.characters = {};
        this.customCSS  = [];

        const lines = code.trim().split('\n');
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line || line.startsWith('#')) continue;
            try { this._parseLine(line); }
            catch(e) { LOG.warn(`Строка ${i+1}: "${line}"`, e); }
        }

        return {
            commands:   this.commands,
            characters: this.characters,
            custom_css: this.customCSS
        };
    }

    _parseLine(line) {
        let m;

        // ── Определение персонажа ──
        m = line.match(/^(\w+)\s*=\s*C\(\s*"([^"]*)"\s*,\s*"([^"]*)"\s*\)/);
        if (m) {
            this.characters[m[1]] = { name: m[2], color: m[3] };
            return true;
        }

        // ── CSS ──
        m = line.match(/^css\(\s*"(.+?)"\s*\)/) || line.match(/^css\(\s*'(.+?)'\s*\)/);
        if (m) { this.customCSS.push(m[1]); this.commands.push({ cmd: 'css', code: m[1] }); return true; }

        // ── Кастомный эффект ──
        m = line.match(/^custom_fx\(\s*"([^"]+)"\s*,\s*"([^"]+)"(.*)?\)/);
        if (m) {
            const rest = m[3] || '', nums = this._nums(rest), named = this._named(rest);
            this.commands.push({ cmd: 'custom_fx', target: m[1], animation: m[2],
                duration: nums[0] ?? 1.0, timing: named.timing ?? 'ease',
                iterations: named.iterations ?? 1, keep: named.keep ?? false });
            return true;
        }

        // ── Кастомный хук ──
        m = line.match(/^custom_hook\(\s*"(\w+)"\s*,\s*"([^"]+)"(.*)\)/);
        if (m) {
            const args = this._strs(m[3]);
            this.commands.push({ cmd: 'custom_hook', type: m[1], func: m[2], args });
            return true;
        }

        // ── chapter() ──
        m = line.match(/^chapter\(\s*"([^"]+)"(.*)\)/);
        if (m) {
            const named = this._named(m[2] || '');
            const strs  = this._strs(m[2] || '');
            this.commands.push({
                cmd:      'chapter',
                title:    m[1],
                subtitle: named.subtitle ?? strs[0] ?? '',
                bg:       named.bg   ?? null,
                duration: named.duration ?? 2.8
            });
            return true;
        }

        // ── scene() ──
        m = line.match(/^scene\(\s*"([^"]+)"(.*)\)/);
        if (m) {
            const named = this._named(m[2] || '');
            this.commands.push({
                cmd:     'scene',
                name:    m[1],
                bg:      named.bg      ?? null,
                music:   named.music   ?? null,
                ambient: named.ambient ?? null,
                daytime: named.daytime ?? null,
                fade:    named.fade    ?? 1.0
            });
            return true;
        }

        // ── bg_color() ──
        m = line.match(/^bg_color\(\s*"([^"]+)"(?:\s*,\s*fade\s*=\s*([\d.]+))?\s*\)/);
        if (m) {
            this.commands.push({ cmd: 'bg_color', color: m[1], fade: parseFloat(m[2] ?? '0.8') });
            return true;
        }

        // ── fullscreen_text() ──
        m = line.match(/^fullscreen_text\(\s*"(.+?)"(.*)\)/);
        if (m) {
            const named = this._named(m[2] || '');
            this.commands.push({
                cmd:      'fullscreen_text',
                text:     m[1].replace(/\\n/g, '\n'),
                duration: named.duration  ?? 3.0,
                bg:       named.bg        ?? '#000000',
                color:    named.color     ?? '#ffffff',
                fontSize: named.font_size ?? '2em'
            });
            return true;
        }

        // ── include() ──
        m = line.match(/^include\(\s*"([^"]+)"\s*\)/);
        if (m) { this.commands.push({ cmd: 'include', file: m[1] }); return true; }

        // ── call() ──
        m = line.match(/^call\(\s*"([^"]+)"\s*(?:,\s*"([^"]+)")?\s*\)/);
        if (m) { this.commands.push({ cmd: 'call', file: m[1], label: m[2] ?? null }); return true; }

        // ── return_from_call() ──
        if (/^return_from_call\(\s*\)/.test(line)) {
            this.commands.push({ cmd: 'return_from_call' }); return true;
        }

        // ── clear() ──
        m = line.match(/^clear\(\s*([\d.]+)?\s*\)/);
        if (m) { this.commands.push({ cmd: 'clear', fade: parseFloat(m[1] ?? '0.3') }); return true; }

        // ── bg() ──
        m = line.match(/^bg\(\s*"([^"]+)"(?:\s*,\s*fade\s*=\s*([\d.]+))?\s*\)/);
        if (m) {
            this.commands.push({
                cmd:  'bg',
                file: Resources.resolve(m[1], 'bg'),
                fade: parseFloat(m[2] ?? '0.8')
            });
            return true;
        }

        // ── fade_out() ──
        m = line.match(/^fade_out\(\s*"?([^",]*)"?\s*(?:,\s*([\d.]+))?\s*\)/);
        if (m) {
            this.commands.push({ cmd: 'fade_out', color: m[1].trim() || 'black', dur: parseFloat(m[2] ?? '0.6') });
            return true;
        }

        // ── fade_in() ──
        m = line.match(/^fade_in\(\s*([\d.]+)?\s*\)/);
        if (m) { this.commands.push({ cmd: 'fade_in', dur: parseFloat(m[1] ?? '0.6') }); return true; }

        // ── wait() ──
        m = line.match(/^wait\(\s*([\d.]+)\s*\)/);
        if (m) { this.commands.push({ cmd: 'wait', dur: parseFloat(m[1]) }); return true; }

        // ── music() ──
        m = line.match(/^music\(([^)]*)\)/);
        if (m) {
            const args = m[1].trim();
            if (args === 'None' || args === '') {
                this.commands.push({ cmd: 'music', file: null });
            } else {
                const strs = this._strs(args), named = this._named(args);
                this.commands.push({
                    cmd: 'music', file: Resources.resolve(strs[0], 'music'),
                    fade_in: named.fade_in ?? 0, fade_out: named.fade_out ?? 0,
                    start: named.start ?? 0, volume: named.volume ?? 1.0
                });
            }
            return true;
        }

        // ── ambient() ──
        m = line.match(/^ambient\(([^)]*)\)/);
        if (m) {
            const args = m[1].trim();
            if (args === 'None' || args === '') {
                this.commands.push({ cmd: 'ambient', file: null });
            } else {
                const strs = this._strs(args), named = this._named(args);
                this.commands.push({
                    cmd: 'ambient', file: Resources.resolve(strs[0], 'ambient'),
                    volume: named.volume ?? 1.0
                });
            }
            return true;
        }

        // ── sfx() ──
        m = line.match(/^sfx\(\s*"([^"]+)"(?:\s*,\s*volume\s*=\s*([\d.]+))?\s*\)/);
        if (m) {
            this.commands.push({ cmd: 'sfx', file: Resources.resolve(m[1], 'sfx'), volume: parseFloat(m[2] ?? '1.0') });
            return true;
        }

        // ── sprite() ──
        m = line.match(/^sprite\(\s*"([^"]+)"\s*,\s*"([^"]+)"(?:\s*,\s*"?([^",)]+)"?)?(.*)?\)/);
        if (m) {
            const rest = m[4] || '', named = this._named(rest);
            this.commands.push({
                cmd: 'sprite', id: m[1], file: Resources.resolve(m[2], 'sprites'),
                pos: m[3] ? m[3].trim() : null,
                zoom: named.zoom ?? 1.0, flip: named.flip ?? false, transition: named.transition ?? 0
            });
            return true;
        }

        // ── show() ──
        m = line.match(/^show\(\s*"([^"]+)"\s*,\s*"?([^",)]+)"?(.*)?\)/);
        if (m) {
            const rest = m[3] || '', named = this._named(rest);
            this.commands.push({
                cmd: 'show', sprite: Resources.resolve(m[1], 'sprites'),
                pos: m[2].trim(),
                zoom: named.zoom ?? 1.0, flip: named.flip ?? false, transition: named.transition ?? 0
            });
            return true;
        }

        // ── hide() ──
        m = line.match(/^hide\(\s*"([^"]+)"(?:\s*,\s*fade\s*=\s*([\d.]+))?\s*\)/);
        if (m) { this.commands.push({ cmd: 'hide', target: m[1], fade: parseFloat(m[2] ?? '0.3') }); return true; }

        // ── move() ──
        m = line.match(/^move\(\s*"([^"]+)"\s*,\s*"?([^",)]+)"?\s*,\s*([\d.]+)\s*\)/);
        if (m) { this.commands.push({ cmd: 'move', target: m[1], pos: m[2].trim(), dur: parseFloat(m[3]) }); return true; }

        // ── fx() ──
        m = line.match(/^fx\(\s*"([^"]+)"\s*,\s*"(\w+)"(.*)?\)/);
        if (m) {
            const nums = this._nums(m[3] || '');
            this.commands.push({ cmd: 'fx', target: m[1], effect: m[2], param1: nums[0] ?? 0.5, param2: nums[1] ?? null });
            return true;
        }

        // ── daytime() ──
        m = line.match(/^daytime\(\s*"(\w+)"\s*\)/);
        if (m) { this.commands.push({ cmd: 'daytime', time: m[1] }); return true; }

        // ── screen() ──
        m = line.match(/^screen\(\s*"(\w+)"(.*)?\)/);
        if (m) {
            const nums = this._nums(m[2] || '');
            this.commands.push({ cmd: 'screen', effect: m[1], dur: nums[0] ?? 0.5 });
            return true;
        }

        // ── chromakey() ──
        m = line.match(/^chromakey\(([^)]*)\)/);
        if (m) {
            const arg = m[1].trim();
            if (arg === 'None' || arg === '') {
                this.commands.push({ cmd: 'chromakey', color: null });
            } else {
                const strs = this._strs(arg), named = this._named(arg);
                this.commands.push({ cmd: 'chromakey', color: strs[0] ?? null, tolerance: named.tolerance ?? 30 });
            }
            return true;
        }

        // ── label() ──
        m = line.match(/^label\(\s*"(\w+)"\s*\)/);
        if (m) { this.commands.push({ cmd: 'label', name: m[1] }); return true; }

        // ── jump() ──
        m = line.match(/^jump\(\s*"(\w+)"\s*\)/);
        if (m) { this.commands.push({ cmd: 'jump', target: m[1] }); return true; }

        // ── set() ──
        m = line.match(/^set\(\s*"(\w+)"\s*,\s*(.+)\s*\)/);
        if (m) { this.commands.push({ cmd: 'set', var: m[1], val: this._val(m[2].trim()) }); return true; }

        // ── add() ──
        m = line.match(/^add\(\s*"(\w+)"\s*,\s*(-?[\d.]+)\s*\)/);
        if (m) { this.commands.push({ cmd: 'add', var: m[1], val: parseFloat(m[2]) }); return true; }

        // ── if_() ──
        m = line.match(/^if_\(\s*"(\w+)"\s*\):\s*(.+)/);
        if (m) {
            const sub = new ScenarioParser(this.modId);
            this.commands.push({ cmd: 'if', var: m[1], then: sub.parse(m[2].trim()).commands });
            return true;
        }

        // ── if_cmp() ──
        m = line.match(/^if_cmp\(\s*"(\w+)"\s*,\s*"([<>=!]+)"\s*,\s*(-?[\d.]+)\s*\):\s*(.+)/);
        if (m) {
            const sub = new ScenarioParser(this.modId);
            this.commands.push({
                cmd: 'if_cmp', var: m[1], op: m[2],
                val: parseFloat(m[3]),
                then: sub.parse(m[4].trim()).commands
            });
            return true;
        }

        // ── choice() ──
        m = line.match(/^choice\((.+)\)/);
        if (m) {
            const args = this._strs(m[1]), options = [];
            for (let j = 0; j + 1 < args.length; j += 2)
                options.push({ text: args[j], target: args[j+1] });
            this.commands.push({ cmd: 'choice', options });
            return true;
        }

        // ── Реплика персонажа ──
        m = line.match(/^(\w+)\(\s*"(.*)"\s*\)/);
        if (m && this.characters[m[1]]) {
            const ch = this.characters[m[1]];
            this.commands.push({ cmd: 'say', name: ch.name, color: ch.color, text: m[2] });
            return true;
        }

        return false;
    }

    _strs(s)  { return Array.from(s.matchAll(/"([^"]*)"/g), m => m[1]); }
    _nums(s)  { return Array.from(s.matchAll(/-?[\d.]+/g), m => parseFloat(m[0])); }
    _named(s) {
        const r = {};
        for (const m of s.matchAll(/(\w+)\s*=\s*([^,)]+)/g)) r[m[1]] = this._val(m[2].trim());
        return r;
    }
    _val(s) {
        s = s.replace(/^['"]|['"]$/g, '');
        if (s === 'True')  return true;
        if (s === 'False') return false;
        if (s === 'None')  return null;
        const n = parseFloat(s);
        return isNaN(n) ? s : n;
    }
}

// ============================================================
// VN ENGINE
// ============================================================

const VN = {
    // ── Состояние выполнения ──
    commands:  [],
    cmdIndex:  0,
    isRunning: false,
    isPaused:  false,

    // ── Контекст мода ──
    currentModId:  null,      // id текущего мода
    currentMod:    null,      // объект мода
    modContexts:   new Map(), // modId → context
    callStack:     [],        // для call/return

    // ── Изолированный контекст мода ──
    // (getContext() всегда возвращает правильный объект)

    // ── Аудио ──
    currentMusic:   null,
    currentAmbient: null,

    // ── Chromakey ──
    chromakeyColor:     null,
    chromakeyTolerance: 30,

    // ── Типинг ──
    isTyping:       false,
    typeAnimationId: null,
    fullText:       '',
    currentTextIndex: 0,
    waitingForClick: false,

    // ── Настройки ──
    settings: { volMusic: 40, volAmbient: 40, volSfx: 40, textSpeed: 90 },

    // ── Кэш ──
    imageCache: {},

    // ── DOM ──
    dom: {},

    // ── Кастомные стили (hash → true) ──
    customStylesAdded: new Set(),

    // ── Отслеживание DOM-элементов оверлеев (для очистки) ──
    _overlayElements: [],

    // ── Кастомные JS-хуки модов ──
    // window.ModHooks[modId][funcName]

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    async init() {
        this.dom = {
            game:               document.getElementById('game'),
            bgCurrent:          document.getElementById('bg-current'),
            bgNext:             document.getElementById('bg-next'),
            spritesLayer:       document.getElementById('sprites-layer'),
            daytimeOverlay:     document.getElementById('daytime-overlay'),
            flashOverlay:       document.getElementById('flash-overlay'),
            fadeOverlay:        document.getElementById('fade-overlay'),
            textbox:            document.getElementById('textbox'),
            speaker:            document.getElementById('speaker'),
            dialogue:           document.getElementById('dialogue'),
            continueIndicator:  document.getElementById('continue-indicator'),
            choiceContainer:    document.getElementById('choice-container'),
            clickArea:          document.getElementById('click-area'),
            menu:               document.getElementById('menu'),
            menuBg:             document.getElementById('menu-bg'),
            optionsPanel:       document.getElementById('options-panel'),
            scenarioPanel:      document.getElementById('scenario-panel'),
            scenariosContainer: document.getElementById('scenarios-container'),
            chromakeyCanvas:    document.getElementById('chromakey-canvas'),
            loadingOverlay:     document.getElementById('loading-overlay'),
            loadingText:        document.getElementById('loading-text'),
            loadingBar:         document.getElementById('loading-bar'),
            customStyles:       document.getElementById('custom-styles'),
            pauseMenu:          document.getElementById('pause-menu'),
            pauseOptionsPanel:  document.getElementById('pause-options-panel'),
            chapterOverlay:     document.getElementById('chapter-overlay'),
            chapterTitleText:   document.getElementById('chapter-title-text'),
            chapterSubtitle:    document.getElementById('chapter-subtitle-text'),
            fsTextOverlay:      document.getElementById('fullscreen-text-overlay'),
            fsTextContent:      document.getElementById('fullscreen-text-content')
        };

        this.loadSettings();
        this._setupSliders();
        this._setupEventListeners();

        await Resources.init();
        await this._initMenu();
    },

    // ── Получение изолированного контекста мода ──
    getContext() {
        const id = this.currentModId;
        if (!id) {
            // Legacy: используем сам VN как контекст (как в v1)
            return this;
        }
        if (!this.modContexts.has(id)) {
            this.modContexts.set(id, {
                variables:     {},
                labels:        {},
                sprites:       {},
                spritesByFile: {}
            });
        }
        return this.modContexts.get(id);
    },

    // ============================================================
    // НАСТРОЙКИ И СЛАЙДЕРЫ
    // ============================================================

    loadSettings() {
        try {
            const saved = localStorage.getItem('vn-engine-settings');
            if (saved) Object.assign(this.settings, JSON.parse(saved));
        } catch(e) {}
        this._syncSliders();
        this._updateLabels();
    },

    saveSettings() {
        try { localStorage.setItem('vn-engine-settings', JSON.stringify(this.settings)); } catch(e) {}
    },

    _syncSliders() {
        const s = this.settings;
        document.getElementById('opt-music').value    = s.volMusic;
        document.getElementById('opt-ambient').value  = s.volAmbient;
        document.getElementById('opt-sfx').value      = s.volSfx;
        document.getElementById('opt-speed').value    = s.textSpeed;
        document.getElementById('popt-music').value   = s.volMusic;
        document.getElementById('popt-ambient').value = s.volAmbient;
        document.getElementById('popt-sfx').value     = s.volSfx;
        document.getElementById('popt-speed').value   = s.textSpeed;
    },

    _updateLabels() {
        const s = this.settings;
        document.getElementById('opt-music-val').textContent    = s.volMusic   + '%';
        document.getElementById('opt-ambient-val').textContent  = s.volAmbient + '%';
        document.getElementById('opt-sfx-val').textContent      = s.volSfx     + '%';
        document.getElementById('opt-speed-val').textContent    = s.textSpeed  + '%';
        document.getElementById('popt-music-val').textContent   = s.volMusic   + '%';
        document.getElementById('popt-ambient-val').textContent = s.volAmbient + '%';
        document.getElementById('popt-sfx-val').textContent     = s.volSfx     + '%';
        document.getElementById('popt-speed-val').textContent   = s.textSpeed  + '%';

        if (this.currentMusic)   this.currentMusic.volume   = s.volMusic   / 100;
        if (this.currentAmbient) this.currentAmbient.volume = s.volAmbient / 100;
    },

    _setupSliders() {
        // Главное меню
        const map = {
            'opt-music':   'volMusic',
            'opt-ambient': 'volAmbient',
            'opt-sfx':     'volSfx',
            'opt-speed':   'textSpeed'
        };
        Object.entries(map).forEach(([id, key]) => {
            document.getElementById(id)?.addEventListener('input', e => {
                this.settings[key] = parseInt(e.target.value);
                const mirror = document.getElementById('p' + id);
                if (mirror) mirror.value = this.settings[key];
                this._updateLabels();
                this.saveSettings();
            });
        });

        // Пауза
        const pmap = {
            'popt-music':   'volMusic',
            'popt-ambient': 'volAmbient',
            'popt-sfx':     'volSfx',
            'popt-speed':   'textSpeed'
        };
        Object.entries(pmap).forEach(([id, key]) => {
            document.getElementById(id)?.addEventListener('input', e => {
                this.settings[key] = parseInt(e.target.value);
                const mirror = document.getElementById(id.replace('popt-', 'opt-'));
                if (mirror) mirror.value = this.settings[key];
                this._updateLabels();
                this.saveSettings();
            });
        });
    },

    // ============================================================
    // СОБЫТИЯ
    // ============================================================

    _setupEventListeners() {
        this.dom.clickArea.addEventListener('click', e => { e.preventDefault(); this.handleAdvance(); });
        this.dom.textbox.addEventListener('click',   e => { e.preventDefault(); this.handleAdvance(); });

        document.addEventListener('keydown', e => {
            if (e.code === 'Escape') {
                e.preventDefault();
                if (this.isRunning) {
                    if (this.isPaused) {
                        if (this.dom.pauseOptionsPanel.classList.contains('active'))
                            this.pauseHideOptions();
                        else
                            this.resumeGame();
                    } else {
                        this.pauseGame();
                    }
                }
                return;
            }
            if ((e.code === 'Space' || e.code === 'Enter') && this.isRunning && !this.isPaused) {
                e.preventDefault();
                this.handleAdvance();
            }
        });
    },

    handleAdvance() {
        if (!this.isRunning || this.isPaused) return;
        if (this.isTyping)           this._finishTyping();
        else if (this.waitingForClick) {
            this.waitingForClick = false;
            this.dom.continueIndicator.classList.remove('visible');
            this._executeNext();
        }
    },

    // ============================================================
    // ПАУЗА
    // ============================================================

    pauseGame() {
        if (!this.isRunning || this.isPaused) return;
        this.isPaused = true;
        if (this.currentMusic)   this.currentMusic.volume   = 0;
        if (this.currentAmbient) this.currentAmbient.volume = 0;
        this.dom.clickArea.classList.remove('active');
        this.dom.pauseMenu.classList.add('visible');
    },

    resumeGame() {
        if (!this.isPaused) return;
        this.isPaused = false;
        this.dom.pauseOptionsPanel.classList.remove('active');
        this.dom.pauseMenu.classList.remove('visible');
        if (this.currentMusic)   this.currentMusic.volume   = this.settings.volMusic   / 100;
        if (this.currentAmbient) this.currentAmbient.volume = this.settings.volAmbient / 100;
        if (this.waitingForClick) this.dom.clickArea.classList.add('active');
    },

    pauseShowOptions() { this._syncSliders(); this.dom.pauseOptionsPanel.classList.add('active'); },
    pauseHideOptions() { this.dom.pauseOptionsPanel.classList.remove('active'); },

    showOptions()  { this.dom.optionsPanel.classList.add('active'); },
    hideOptions()  { this.dom.optionsPanel.classList.remove('active'); },

    // ============================================================
    // ГЛАВНОЕ МЕНЮ
    // ============================================================

    async _initMenu() {
        const bg = Resources.hasApi
            ? (Resources.data?.bg?.find(b => b.includes('bus_stop')) || Resources.getRandom('bg'))
            : FALLBACKS.menuBg;

        if (bg) this.dom.menuBg.style.backgroundImage = `url('bg/${bg}?_t=${Date.now()}')`;

        if (!this.isRunning && !this.currentMusic) {
            const menuMusic = Resources.hasApi
                ? (Resources.data?.music?.find(m => m.includes('blow_with_the_fires')) || Resources.getRandom('music'))
                : FALLBACKS.menuMusic;

            if (menuMusic) {
                const audio = new Audio('audio/music/' + menuMusic + '?_t=' + Date.now());
                audio.loop   = true;
                audio.volume = this.settings.volMusic / 100;
                this.currentMusic = audio;
                document.body.addEventListener('click', () => {
                    if (this.currentMusic?.paused && !this.isRunning)
                        this.currentMusic.play().catch(() => {});
                }, { once: true });
            }
        }
    },

    async showScenarios() {
        await ModManager.scanMods();
        const mods = ModManager.getModList();
        const c = this.dom.scenariosContainer;
        c.innerHTML = '';

        if (mods.length === 0) {
            c.innerHTML = '<p style="color:#666;text-align:center;padding:1em;">Сценарии не найдены</p>';
        } else {
            mods.forEach(mod => {
                const btn = document.createElement('button');
                btn.className = 'scenario-btn';

                if (mod.manifest?.name) {
                    const nameStr   = mod.manifest.name;
                    const authorStr = mod.manifest.author ? `автор: ${mod.manifest.author}` : '';
                    const verStr    = mod.manifest.version ? `v${mod.manifest.version}` : '';
                    const tag       = mod.type === 'folder' ? 'мод' : 'legacy';
                    btn.innerHTML   = `
                        <div class="mod-card">
                            <div class="mod-card-title">${nameStr}</div>
                            <div class="mod-card-meta">
                                <span class="mod-card-tag">${tag}</span>
                                ${authorStr} ${verStr}
                            </div>
                        </div>`;
                } else {
                    btn.textContent = mod.id;
                }

                btn.onclick = () => {
                    this.hideScenarios();
                    this.startMod(mod.id);
                };
                c.appendChild(btn);
            });
        }

        this.dom.scenarioPanel.classList.add('active');
    },

    hideScenarios() { this.dom.scenarioPanel.classList.remove('active'); },

    // Кнопка «Тестовый сценарий»
    async startTest() {
        this.dom.menu.classList.add('hidden');
        this.showLoading();
        try {
            const parser = new ScenarioParser(null);
            const data   = parser.parse(TEST_SCENARIO);
            await this._runScenario(data, null);
        } catch(e) {
            LOG.error('startTest', e);
            this.hideLoading();
            this.dom.menu.classList.remove('hidden');
        }
    },

    // ── Запуск мода по id ──
    async startMod(modId) {
        const mod = ModManager.getMod(modId);
        if (!mod) { LOG.error('Мод не найден:', modId); return; }

        this.dom.menu.classList.add('hidden');
        this.showLoading('Загрузка мода...');

        try {
            // Загружаем кастомный CSS мода
            if (mod.custom?.css) await this._loadModCSS(modId, mod.custom.css, mod.basePath);
            // Загружаем кастомный JS мода
            if (mod.custom?.js)  await this._loadModJS (modId, mod.custom.js,  mod.basePath);

            // Загружаем и конкатенируем все py-файлы
            const code = await this._loadModCode(mod);
            if (!code) throw new Error('Нет кода сценария');

            const parser = new ScenarioParser(modId);
            const data   = parser.parse(code);
            await this._runScenario(data, mod);
        } catch(e) {
            LOG.error('startMod', modId, e);
            this._cleanupMod(modId);
            this.hideLoading();
            this.dom.menu.classList.remove('hidden');
        }
    },

    // ── Загрузка кода мода ──
    async _loadModCode(mod) {
        const parts = [];
        const files = mod.type === 'single-file'
            ? [mod.entryFile]
            : [mod.entryFile, ...mod.files.filter(f => f !== mod.entryFile)];

        for (const file of files) {
            const url = mod.basePath + file;
            try {
                const res = await fetchNoCache(url);
                if (res.ok) parts.push(await res.text());
                else LOG.warn('Файл не найден:', url);
            } catch(e) {
                LOG.warn('Ошибка загрузки файла:', url, e);
            }
        }

        return parts.join('\n');
    },

    // ── Загрузка CSS мода ──
    async _loadModCSS(modId, cssFile, basePath) {
        try {
            const res = await fetchNoCache(basePath + cssFile);
            if (!res.ok) return;
            const code = await res.text();
            const el   = document.createElement('style');
            el.id          = `mod-style-${modId}`;
            el.textContent = code;
            document.head.appendChild(el);
            LOG.info('CSS мода загружен:', cssFile);
        } catch(e) { LOG.warn('CSS мода не загружен:', e); }
    },

    // ── Загрузка JS мода ──
    async _loadModJS(modId, jsFile, basePath) {
        try {
            const res = await fetchNoCache(basePath + jsFile);
            if (!res.ok) return;
            const code = await res.text();
            if (!window.ModHooks) window.ModHooks = {};
            window.ModHooks[modId] = {};
            // Выполняем JS в безопасной обёртке с доступом к VN и API хуков
            const fn = new Function('modId', 'VN', 'ModHooks', code);
            fn(modId, VN, window.ModHooks);
            LOG.info('JS мода загружен:', jsFile);
        } catch(e) { LOG.error('JS мода:', e); }
    },

    // ── Очистка ресурсов мода ──
    _cleanupMod(modId) {
        if (!modId) return;
        // CSS
        document.getElementById(`mod-style-${modId}`)?.remove();
        // JS хуки
        if (window.ModHooks) delete window.ModHooks[modId];
        // Контекст
        this.modContexts.delete(modId);
    },

    // ── Возврат в главное меню ──
    returnToMainMenu() {
        const modId = this.currentModId;
        this.isPaused = false;
        this.dom.pauseMenu.classList.remove('visible');
        this.dom.pauseOptionsPanel.classList.remove('active');
        this.isRunning = false;

        if (this.typeAnimationId) clearTimeout(this.typeAnimationId);
        this.isTyping        = false;
        this.waitingForClick = false;

        this._stopAudio(0.5);
        this._clearScene(0);
        this._clearOverlays();

        this.dom.textbox.classList.remove('visible');
        this.dom.clickArea.classList.remove('active');
        this.dom.choiceContainer.classList.remove('visible');
        this.dom.continueIndicator.classList.remove('visible');
        this.dom.chapterOverlay.classList.remove('visible');
        this.dom.fsTextOverlay.classList.remove('visible');

        if (modId) this._cleanupMod(modId);
        this.currentModId = null;
        this.currentMod   = null;
        this.callStack    = [];

        setTimeout(() => {
            this.dom.menu.classList.remove('hidden');
            this._initMenu();
        }, 400);
    },

    // ============================================================
    // ЗАПУСК СЦЕНАРИЯ
    // ============================================================

    async _runScenario(data, mod) {
        this.isRunning       = true;
        this.isPaused        = false;
        this.currentModId    = mod?.id ?? null;
        this.currentMod      = mod ?? null;
        this.commands        = data.commands || [];
        this.cmdIndex        = 0;
        this.isTyping        = false;
        this.waitingForClick = false;
        this.callStack       = [];

        // Сбрасываем/инициализируем контекст
        if (this.currentModId) {
            this.modContexts.set(this.currentModId, {
                variables: {}, labels: {}, sprites: {}, spritesByFile: {}
            });
        } else {
            // Legacy: прямые поля
            this.variables     = {};
            this.sprites       = {};
            this.spritesByFile = {};
        }

        this.resetCustomCSS();
        if (data.custom_css) data.custom_css.forEach(css => this.addCustomCSS(css));

        this.hideLoading();

        // Индексируем метки
        this._indexLabels(this.commands);

        // Подготовка DOM
        this.dom.textbox.classList.add('visible');
        this.dom.clickArea.classList.add('active');
        this.dom.continueIndicator.classList.remove('visible');
        this.dom.spritesLayer.innerHTML = '';
        this.dom.bgCurrent.style.backgroundImage = '';
        this.dom.bgNext.style.backgroundImage    = '';
        this.dom.bgNext.style.opacity            = '0';
        this.dom.daytimeOverlay.style.background = '';
        this.dom.fadeOverlay.style.transition     = 'none';
        this.dom.fadeOverlay.style.opacity        = '0';
        this.dom.fadeOverlay.style.background     = '#000';
        this.dom.flashOverlay.style.opacity       = '0';
        this.dom.speaker.textContent  = '';
        this.dom.dialogue.textContent = '';
        this.dom.pauseMenu.classList.remove('visible');
        this.dom.pauseOptionsPanel.classList.remove('active');
        this.dom.chapterOverlay.classList.remove('visible');
        this.dom.fsTextOverlay.classList.remove('visible');
        this._overlayElements = [];

        if (this.currentMusic)  { this.currentMusic.pause();  this.currentMusic  = null; }
        if (this.currentAmbient){ this.currentAmbient.pause(); this.currentAmbient = null; }

        void this.dom.fadeOverlay.offsetHeight;
        this._executeNext();
    },

    // ── Индексирование меток (рекурсивно по командам) ──
    _indexLabels(commands) {
        const ctx = this.getContext();
        // Индексируем в контекст
        const labels = (ctx === this) ? (this.labels = {}) : (ctx.labels = {});
        commands.forEach((cmd, i) => { if (cmd.cmd === 'label') labels[cmd.name] = i; });
    },

    _getLabels() {
        const ctx = this.getContext();
        return (ctx === this) ? (this.labels || {}) : (ctx.labels || {});
    },

    // ============================================================
    // КОНВЕЙЕР ВЫПОЛНЕНИЯ (async)
    // ============================================================

    _executeNext() {
        if (this.cmdIndex >= this.commands.length) {
            this._endScenario();
            return;
        }
        const cmd = this.commands[this.cmdIndex++];
        this._executeCommand(cmd);
    },

    _executeCommand(cmd) {
        if (!cmd?.cmd) { this._executeNext(); return; }
        try {
            const h = {
                bg:             () => this.cmdBg(cmd),
                bg_color:       () => this.cmdBgColor(cmd),
                fade_out:       () => this.cmdFadeOut(cmd),
                fade_in:        () => this.cmdFadeIn(cmd),
                wait:           () => setTimeout(() => this._executeNext(), (cmd.dur || 0.5) * 1000),
                music:          () => this.cmdMusic(cmd),
                ambient:        () => this.cmdAmbient(cmd),
                sfx:            () => this.cmdSfx(cmd),
                sprite:         () => this.cmdSprite(cmd),
                show:           () => this.cmdShow(cmd),
                hide:           () => this.cmdHide(cmd),
                clear:          () => this.cmdClear(cmd),
                move:           () => this.cmdMove(cmd),
                fx:             () => this.cmdFx(cmd),
                custom_fx:      () => this.cmdCustomFx(cmd),
                css:            () => { this.addCustomCSS(cmd.code); this._executeNext(); },
                daytime:        () => this.cmdDaytime(cmd),
                screen:         () => this.cmdScreen(cmd),
                chromakey:      () => { this.chromakeyColor = cmd.color; this.chromakeyTolerance = cmd.tolerance || 30; this._executeNext(); },
                chapter:        () => this.cmdChapter(cmd),
                scene:          () => this.cmdScene(cmd),
                fullscreen_text:() => this.cmdFullscreenText(cmd),
                include:        () => this.cmdInclude(cmd),
                call:           () => this.cmdCall(cmd),
                return_from_call: () => this.cmdReturnFromCall(),
                custom_hook:    () => this.cmdCustomHook(cmd),
                say:            () => this.cmdSay(cmd),
                choice:         () => this.cmdChoice(cmd),
                label:          () => this._executeNext(),
                jump:           () => { const labels = this._getLabels(); if (labels[cmd.target] !== undefined) this.cmdIndex = labels[cmd.target]; this._executeNext(); },
                set:            () => { const ctx = this.getContext(); (ctx === this ? ctx : ctx).variables[cmd.var] = cmd.val; this._executeNext(); },
                add:            () => { const ctx = this.getContext(); const vars = (ctx === this) ? ctx.variables : ctx.variables; vars[cmd.var] = (vars[cmd.var] || 0) + cmd.val; this._executeNext(); },
                if:             () => this.cmdIf(cmd),
                if_cmp:         () => this.cmdIfCmp(cmd)
            };
            (h[cmd.cmd] || (() => this._executeNext()))();
        } catch(e) {
            LOG.error('Команда:', cmd, e);
            this._executeNext();
        }
    },

    // ============================================================
    // ЗАГРУЗКА / UI
    // ============================================================

    showLoading(text = 'Загрузка...') {
        this.dom.loadingText.textContent = text;
        this.dom.loadingBar.style.width  = '0%';
        this.dom.loadingOverlay.classList.add('visible');
    },

    setLoadingProgress(pct) {
        this.dom.loadingBar.style.width = Math.round(pct) + '%';
    },

    hideLoading() {
        this.dom.loadingOverlay.classList.remove('visible');
    },

    // ============================================================
    // CSS КАСТОМИЗАЦИЯ
    // ============================================================

    addCustomCSS(code) {
        const hash = code.split('').reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);
        if (this.customStylesAdded.has(hash)) return;
        this.customStylesAdded.add(hash);
        this.dom.customStyles.textContent += '\n' + code;
    },

    resetCustomCSS() {
        this.dom.customStyles.textContent = '';
        this.customStylesAdded.clear();
    },

    // ============================================================
    // ИЗОБРАЖЕНИЯ
    // ============================================================

    async _preloadImages(urls) {
        const toLoad = urls.filter(u => !this.imageCache[u]);
        if (!toLoad.length) return;
        let loaded = 0;
        await Promise.all(toLoad.map(url => new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                this.imageCache[url] = img;
                loaded++;
                this.setLoadingProgress(loaded / toLoad.length * 100);
                resolve();
            };
            img.onerror = () => { loaded++; resolve(); };
            img.src = url + '?_t=' + Date.now();
        })));
    },

    _resolveFilePath(filename, category) {
        const mod = this.currentMod;
        return Resources.resolveModPath(filename, category, mod?.id, mod?.assets ?? null);
    },

    // ============================================================
    // АУДИО
    // ============================================================

    _stopAudio(fadeDur = 0) {
        if (this.currentMusic) {
            if (fadeDur > 0) {
                this._fadeOutAudio(this.currentMusic, fadeDur);
                const m = this.currentMusic;
                setTimeout(() => m.pause(), (fadeDur + 0.1) * 1000);
            } else {
                this.currentMusic.pause();
            }
            this.currentMusic = null;
        }
        if (this.currentAmbient) {
            this.currentAmbient.pause();
            this.currentAmbient = null;
        }
    },

    _fadeInAudio(audio, dur, target) {
        audio.volume = 0;
        const step = target / 30;
        const iv = setInterval(() => {
            if (audio.volume + step < target) audio.volume += step;
            else { audio.volume = target; clearInterval(iv); }
        }, dur * 1000 / 30);
    },

    _fadeOutAudio(audio, dur) {
        const start = audio.volume;
        const step  = start / 30;
        const iv = setInterval(() => {
            if (audio.volume > step) audio.volume -= step;
            else { audio.volume = 0; audio.pause(); clearInterval(iv); }
        }, dur * 1000 / 30);
    },

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ДЛЯ СПРАЙТОВ
    // ============================================================

    _getSprites() {
        const ctx = this.getContext();
        return (ctx === this)
            ? { sprites: this.sprites, spritesByFile: this.spritesByFile }
            : { sprites: ctx.sprites, spritesByFile: ctx.spritesByFile };
    },

    parsePosition(pos) {
        if (pos === 'left')   return 25;
        if (pos === 'center') return 50;
        if (pos === 'right')  return 75;
        return parseFloat(pos) || 50;
    },

    _setSpriteImage(container, filename, transition, onComplete) {
        const cacheKey = 'sprites/' + filename;
        let img;
        if (this.imageCache[cacheKey]) {
            img = this.imageCache[cacheKey].cloneNode();
        } else {
            img = new Image();
            img.src = this._resolveFilePath(filename, 'sprites') + '?_t=' + Date.now();
        }

        const apply = finalImg => {
            if (this.chromakeyColor) {
                this._applyChromakeyToImage(finalImg, processed => {
                    this._replaceImage(container.querySelector('.sprite-inner'), processed, transition);
                    onComplete?.();
                });
            } else {
                this._replaceImage(container.querySelector('.sprite-inner'), finalImg, transition);
                onComplete?.();
            }
        };

        if (img.complete && img.naturalHeight !== 0) apply(img);
        else { img.onload = () => apply(img); img.onerror = () => onComplete?.(); }
    },

    _replaceImage(inner, newImg, transition = 0) {
        const existing = inner.querySelector('img');
        newImg.style.cssText = 'display:block;margin:0 auto;';
        if (existing && transition > 0) {
            Object.assign(newImg.style, {
                position: 'absolute', top: '0', left: '50%',
                transform: 'translateX(-50%)', opacity: '0',
                transition: `opacity ${transition}s ease`
            });
            inner.style.position = 'relative';
            inner.appendChild(newImg);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                newImg.style.opacity   = '1';
                existing.style.transition = `opacity ${transition}s ease`;
                existing.style.opacity = '0';
            }));
            setTimeout(() => {
                existing.remove();
                newImg.style.cssText = 'display:block;margin:0 auto;';
            }, transition * 1000 + 50);
        } else if (existing) {
            existing.replaceWith(newImg);
        } else {
            inner.appendChild(newImg);
        }
    },

    _applyChromakeyToImage(img, cb) {
        const canvas = this.dom.chromakeyCanvas;
        const ctx    = canvas.getContext('2d');
        canvas.width = img.width; canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = data.data;
        const r = parseInt(this.chromakeyColor.slice(1,3), 16);
        const g = parseInt(this.chromakeyColor.slice(3,5), 16);
        const b = parseInt(this.chromakeyColor.slice(5,7), 16);
        const tol = this.chromakeyTolerance;
        for (let i = 0; i < d.length; i += 4) {
            const dist = Math.sqrt((d[i]-r)**2 + (d[i+1]-g)**2 + (d[i+2]-b)**2);
            if (dist < tol)        d[i+3] = 0;
            else if (dist < tol*2) d[i+3] = Math.floor(255 * (dist - tol) / tol);
        }
        ctx.putImageData(data, 0, 0);
        const processed = new Image();
        processed.onload = () => cb(processed);
        processed.src = canvas.toDataURL('image/png');
    },

    // ── Очистка спрайтов ──
    _clearSprites(fadeDur, onDone) {
        const { sprites, spritesByFile } = this._getSprites();
        [...Object.values(sprites), ...Object.values(spritesByFile)].forEach(el => {
            el.classList.add('hiding'); el.classList.remove('visible');
        });
        setTimeout(() => {
            this.dom.spritesLayer.innerHTML = '';
            const ctx = this.getContext();
            if (ctx === this) { this.sprites = {}; this.spritesByFile = {}; }
            else              { ctx.sprites = {}; ctx.spritesByFile = {}; }
            onDone?.();
        }, fadeDur * 1000);
    },

    // ── Полная очистка сцены ──
    _clearScene(fadeDur = 0.3) {
        this._clearSprites(fadeDur, null);
        setTimeout(() => {
            this.dom.bgCurrent.style.backgroundImage = '';
            this.dom.bgNext.style.backgroundImage    = '';
            this.dom.bgNext.style.opacity            = '0';
        }, fadeDur * 1000 + 10);
    },

    // ── Очистка DOM-оверлеев (chapter, fullscreen_text и прочих) ──
    _clearOverlays() {
        for (const el of this._overlayElements) {
            el.remove();
        }
        this._overlayElements = [];
        this.dom.fadeOverlay.style.opacity  = '0';
        this.dom.flashOverlay.style.opacity = '0';
        this.dom.daytimeOverlay.style.background = '';
    },

    // ============================================================
    // КОМАНДЫ — ФОН
    // ============================================================

    cmdBg(cmd) {
        if (!cmd.file) { this._executeNext(); return; }
        const path = this._resolveFilePath(cmd.file, 'bg');
        const url  = path + '?_t=' + Date.now();
        const dur  = cmd.fade || 0.8;

        this.dom.bgNext.style.backgroundImage = `url('${url}')`;
        this.dom.bgNext.style.transition      = `opacity ${dur}s ease-in-out`;
        void this.dom.bgNext.offsetHeight;
        this.dom.bgNext.style.opacity = '1';

        setTimeout(() => {
            this.dom.bgCurrent.style.backgroundImage = `url('${url}')`;
            this.dom.bgNext.style.transition         = 'none';
            this.dom.bgNext.style.opacity            = '0';
            this._executeNext();
        }, dur * 1000);
    },

    cmdBgColor(cmd) {
        const dur = cmd.fade || 0.8;
        // Убираем старые цветовые фоны
        this.dom.bgCurrent.style.backgroundImage = '';
        this.dom.bgNext.style.backgroundImage    = '';
        this.dom.bgNext.style.opacity            = '0';

        // Ставим цвет через bgCurrent
        this.dom.bgCurrent.style.background = cmd.color;

        // Анимация через фейд-оверлей (временный)
        // На самом деле проще просто установить и дать паузу
        this.dom.bgCurrent.style.transition = `background ${dur}s ease`;
        setTimeout(() => {
            this.dom.bgCurrent.style.transition = '';
            this._executeNext();
        }, dur * 1000);
    },

    // ============================================================
    // КОМАНДЫ — ПЕРЕХОДЫ
    // ============================================================

    cmdFadeOut(cmd) {
        const dur = cmd.dur || 0.6;
        this.dom.fadeOverlay.style.background  = cmd.color || 'black';
        this.dom.fadeOverlay.style.transition  = `opacity ${dur}s ease-in-out`;
        void this.dom.fadeOverlay.offsetHeight;
        this.dom.fadeOverlay.style.opacity = '1';
        setTimeout(() => this._executeNext(), dur * 1000);
    },

    cmdFadeIn(cmd) {
        const dur = cmd.dur || 0.6;
        this.dom.fadeOverlay.style.transition = `opacity ${dur}s ease-in-out`;
        void this.dom.fadeOverlay.offsetHeight;
        this.dom.fadeOverlay.style.opacity = '0';
        setTimeout(() => this._executeNext(), dur * 1000);
    },

    // ============================================================
    // КОМАНДЫ — АУДИО
    // ============================================================

    cmdMusic(cmd) {
        if (this.currentMusic) {
            cmd.fade_out > 0
                ? this._fadeOutAudio(this.currentMusic, cmd.fade_out)
                : this.currentMusic.pause();
            this.currentMusic = null;
        }
        if (!cmd.file) { this._executeNext(); return; }

        const path  = this._resolveFilePath(cmd.file, 'music');
        const audio = new Audio(path + '?_t=' + Date.now());
        audio.loop   = true;
        audio.volume = 0;
        if (cmd.start) audio.currentTime = cmd.start;
        this.currentMusic = audio;

        audio.play().then(() => {
            const target = (cmd.volume || 1) * this.settings.volMusic / 100;
            cmd.fade_in > 0 ? this._fadeInAudio(audio, cmd.fade_in, target) : (audio.volume = target);
        }).catch(e => LOG.warn('Музыка:', e));

        this._executeNext();
    },

    cmdAmbient(cmd) {
        if (this.currentAmbient) { this.currentAmbient.pause(); this.currentAmbient = null; }
        if (!cmd.file) { this._executeNext(); return; }

        const path  = this._resolveFilePath(cmd.file, 'ambient');
        const audio = new Audio(path + '?_t=' + Date.now());
        audio.loop   = true;
        audio.volume = (cmd.volume || 1) * this.settings.volAmbient / 100;
        this.currentAmbient = audio;
        audio.play().catch(e => LOG.warn('Эмбиент:', e));
        this._executeNext();
    },

    cmdSfx(cmd) {
        if (!cmd.file) { this._executeNext(); return; }
        const path  = this._resolveFilePath(cmd.file, 'sfx');
        const audio = new Audio(path + '?_t=' + Date.now());
        audio.volume = (cmd.volume || 1) * this.settings.volSfx / 100;
        audio.play().catch(e => LOG.warn('SFX:', e));
        this._executeNext();
    },

    // ============================================================
    // КОМАНДЫ — СПРАЙТЫ
    // ============================================================

    cmdSprite(cmd) {
        if (!cmd.file) { this._executeNext(); return; }
        const { sprites } = this._getSprites();
        const ctx = this.getContext();
